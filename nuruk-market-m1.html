<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>누룩 마켓</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --bg:#0B1020; --panel:#151C31; --panel2:#1B2440; --line:#2A3550; --line2:#202942;
  --tx:#C8D4EA; --tx2:#8B9BBB; --tx3:#6B7A9B;
  --up:#FF5B4A; --dn:#4A9BFF; --warn:#FFD84A;
  --news:#E8A33D; --sewer:#9AA84A; --mkt:#3FC5D8; --map:#6FD186; --work:#F0783C; --play:#C77BE0;
  --nuruk:#F0D9B0; --nuruk2:#E3C48E; --nuruk3:#C79A6A; --mouth:#E63950; --hair:#F2D98A; --eye:#F26B1D;
}
*{box-sizing:border-box}
/* 한글은 띄어쓰기에서만 줄을 바꾼다 — 기본값은 글자 사이 아무 데서나 끊어서 「그 / 런」처럼 된다.
   한 덩어리가 줄보다 길 때만 어쩔 수 없이 쪼갠다 */
body{word-break:keep-all;overflow-wrap:break-word;background:var(--bg);color:var(--tx);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,.tab:focus-visible{outline:2px solid var(--mkt);outline-offset:1px}

#app{display:flex;height:100vh;width:100%;overflow:hidden;visibility:hidden}
#app.ready{visibility:visible}
#side{width:calc(280px * var(--z,1));flex:none;background:var(--panel);
  border-right:1px solid var(--line);transition:width .22s ease,opacity .18s ease;
  overflow-x:hidden;overflow-y:auto;scrollbar-width:thin}
#sidein{zoom:var(--z,1);display:flex;flex-direction:column;min-height:calc(100vh / var(--z,1))}
#tabs{zoom:var(--z,1)}
.wrap{zoom:var(--z,1)}
#app.collapsed #side{width:0;opacity:0;border-right:0}
#grip{width:14px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx3)}
#grip:hover{background:var(--panel2);color:var(--tx)}
#main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}

.portrait{position:relative;height:186px;flex:none;border-bottom:1px solid var(--line);
  background:radial-gradient(ellipse at 50% 120%,#1E2748 0%,#0E1428 70%);overflow:hidden}
.stars{position:absolute;inset:0}
.pname{position:absolute;top:10px;right:12px;font-size:12px;letter-spacing:.06em;
  border:1px solid var(--line);padding:3px 10px;background:rgba(11,16,32,.7)}
.charwrap{position:absolute;left:0;right:0;bottom:0;
  display:flex;justify-content:center;align-items:flex-end;gap:2px}
#pchar{height:172px;width:auto;display:block;transform-origin:center bottom;
  animation:bob 3.6s ease-in-out infinite;filter:drop-shadow(0 3px 10px rgba(0,0,0,.35))}
#pchar.squish,.nface.squish{animation:none;transform:scaleY(.86) scaleX(1.10);transition:transform .11s}
@keyframes bob{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-3px) scaleY(.97)}}
@media (prefers-reduced-motion:reduce){#nurukG{animation:none}}

.infoline{padding:9px 14px;border-bottom:1px solid var(--line2);font-size:12.5px;color:var(--tx2);
  display:flex;justify-content:space-between;gap:8px}
.cashline{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:7px}
.cashline b{font-size:22px;font-weight:600}
.cashline small{color:var(--tx3);font-size:11px}
.cashline .dlt{margin-left:auto;font-size:12px}

/* 시간대 */
.clock{padding:11px 14px;border-bottom:1px solid var(--line)}
.clock .ch{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx3);
  letter-spacing:0;margin-bottom:7px}
.clock .ch b{color:var(--warn);font-weight:600;letter-spacing:.04em}
.tslots{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.ts{border:1px solid var(--line);background:var(--bg);padding:7px 2px 6px;text-align:center;
  font-size:12px;color:var(--tx3);position:relative}
.ts.now{border-color:var(--warn);color:var(--warn);background:rgba(255,216,74,.08)}
.ts.done{background:var(--line2);color:#4A5570;border-color:var(--line2)}
.ts i{display:block;font-size:10px;font-style:normal;letter-spacing:.1em;margin-top:3px;opacity:.85;
  font-family:"IBM Plex Mono",monospace}
.ts.mkt::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--mkt);opacity:.5}
.ts.done.mkt::after{opacity:.15}

.nuruk-bar{padding:11px 14px;border-bottom:1px solid var(--line);min-height:50px}
.nface{width:72px;flex:0 0 auto;display:block;margin-bottom:14px;transform-origin:center bottom;
  animation:nbob 3.1s ease-in-out infinite;filter:drop-shadow(0 3px 7px rgba(0,0,0,.45))}
@keyframes nbob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.04,.96)}}
@media (prefers-reduced-motion:reduce){.nface{animation:none}}
.nuruk-bar .nuruk-say{font-size:12.5px;line-height:1.6;color:var(--tx2);margin:0}
.nuruk-bar .nuruk-say b{color:var(--nuruk);font-weight:500}
.petrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.petcard{border:1px solid var(--line);background:var(--panel);padding:13px 15px;text-align:left}
.petcard:hover:not(:disabled){border-color:var(--nuruk)}
.petcard:disabled{opacity:.38;cursor:not-allowed}
.petcard .pn2{font-weight:600;font-size:14px}
.petcard .pv{font-size:12px;color:var(--tx3);margin-top:3px}
@media(max-width:620px){.petrow{grid-template-columns:1fr}}
.nuruk-bar--old{padding:9px 14px;border-bottom:1px solid var(--line);display:grid;
  grid-template-columns:1fr 1fr 1fr;gap:5px}
.nuruk-bar button{border:1px solid var(--line);background:var(--bg);padding:6px 2px;
  font-size:11.5px;color:var(--nuruk);transition:.14s}
.nuruk-bar button:hover:not(:disabled){border-color:var(--nuruk);background:rgba(240,217,176,.08)}
.nuruk-bar button:disabled{opacity:.3;cursor:not-allowed;color:var(--tx3)}
.nuruk-bar button i{display:block;font-style:normal;font-size:10.5px;color:var(--tx3);margin-top:2px}
.nuruk-say{grid-column:1/-1;font-size:11.5px;color:var(--tx2);padding:5px 2px 0;line-height:1.45}
/* 미니게임 */
.mg{border:1px solid var(--play);background:var(--panel);padding:18px;text-align:center}
.mg-t{font-size:13px;color:var(--tx2);margin-bottom:12px}
.mg-btn{width:190px;height:150px;border:0;background:none;padding:0;margin:0 auto;
  display:flex;align-items:flex-end;justify-content:center;
  transition:transform .06s;user-select:none;-webkit-tap-highlight-color:transparent}
.mg-btn img{width:100%;display:block;pointer-events:none;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.mg-btn:active{transform:scaleY(.82) scaleX(1.09)}
.mg-btn.hit{transform:scaleY(.86) scaleX(1.06)}
.mg-btn:disabled{opacity:.35}
.mg-n{font-family:"IBM Plex Mono",monospace;font-size:28px;font-weight:600;margin:10px 0 4px}
.mg-bar{height:6px;background:var(--line2);margin:10px auto 0;max-width:260px}
.mg-bar i{display:block;height:100%;background:var(--play);transition:width .1s linear}
.meters{padding:11px 14px;border-bottom:1px solid var(--line);display:grid;gap:9px}
.meter .mh{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx3);
  letter-spacing:0;margin-bottom:4px}
.meter .bar{height:5px;background:var(--line2);position:relative;overflow:hidden}
.meter .bar i{position:absolute;left:0;top:0;bottom:0;display:block;transition:width .3s}

.menu{padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.menu button{border:1px solid var(--line);padding:8px 4px;font-size:12.5px;color:var(--tx2);
  background:var(--panel2);transition:.14s}
.menu button:hover{border-color:var(--mkt);color:var(--tx)}
.menu .wide{grid-column:1/-1}
.menu .quit{border-color:#5A2733;color:#E0808F}
.menu .quit:hover{border-color:var(--up);color:var(--up)}
.sidefoot{margin-top:auto;padding:10px 14px;border-top:1px solid var(--line2);
  font-size:11.5px;color:var(--tx3);letter-spacing:0}

#tabs{display:flex;flex:none;border-bottom:1px solid var(--line);background:var(--panel)}
.tab{flex:1;padding:11px 6px 9px;font-size:13px;color:var(--tx3);border-right:1px solid var(--line);
  border-bottom:2px solid transparent;position:relative;transition:.14s;white-space:nowrap}
.tab:last-child{border-right:0}
.tab:hover{color:var(--tx);background:var(--panel2)}
.tab.active{color:var(--tc);border-bottom-color:var(--tc);background:var(--bg)}
.tab .dot{position:absolute;top:7px;right:9px;width:5px;height:5px;border-radius:50%;background:var(--tc)}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 24px 46px}
#viewrow{flex:1;display:flex;min-height:0}
#viewrow>#view{min-width:0}
.tklink{color:var(--mkt);cursor:pointer;font-family:"IBM Plex Mono",monospace;text-decoration:underline;text-underline-offset:2px}
.padbtn{margin-left:auto;border:1px solid var(--line);padding:4px 11px;font-size:12px;color:var(--tx2)}
.padbtn.on{border-color:var(--mkt);color:var(--tx)}
/* 수첩 — 화면 위에 떠 있는 창. 연 채로 사고팔고 돌아다닌다.
   제목줄을 끌면 옮겨지고, 가장자리를 끌면 크기가 바뀐다. 처음엔 오른쪽에 붙어 있다.
   하루 마감 띠(40)보다 아래, 밤·아침 장면(70)과 모달(100)보다 아래 */
#bookwin{position:fixed;z-index:38;display:flex;flex-direction:column;background:var(--panel);
  border:1px solid var(--line);box-shadow:0 24px 60px -16px rgba(0,0,0,.8),0 2px 10px rgba(0,0,0,.35)}
#bookwin[hidden]{display:none}
#bwbar{display:flex;align-items:center;gap:9px;height:38px;flex:none;padding:0 4px 0 14px;background:var(--panel2);
  border-bottom:1px solid var(--line);cursor:move;user-select:none;-webkit-user-select:none;touch-action:none}
#bwbar b{font-size:13px;font-weight:600;flex:none}
#bwbar span{font-size:11.5px;color:var(--tx3);font-family:"IBM Plex Mono",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bwbtns{margin-left:auto;display:flex;flex:none}
.bwbtns button{width:32px;height:30px;color:var(--tx3);font-size:13px;line-height:1;cursor:pointer}
.bwbtns button:hover{color:var(--tx);background:var(--line)}
.bwbtns .bwx:hover{background:var(--up);color:var(--bg)}
#bookwin .bktabs{flex:none;margin:0;padding:0 8px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#bookwin .bktabs button{white-space:nowrap}
#bwbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#bwtabs,.bwin{zoom:var(--z,1)}                       /* 글자 크기 설정을 따른다 — 제목줄은 창틀이라 그대로 */
#bookwin.fold{height:auto!important}
#bookwin.fold .bktabs,#bookwin.fold #bwbody,#bookwin.fold .bwgrip{display:none}
#bookwin.fold #bwbar{border-bottom:0}
.bwgrip{position:absolute;z-index:2;touch-action:none}
.bwgrip.w{left:-4px;top:38px;bottom:10px;width:8px;cursor:ew-resize}
.bwgrip.e{right:-4px;top:38px;bottom:10px;width:8px;cursor:ew-resize}
.bwgrip.s{left:10px;right:10px;bottom:-4px;height:8px;cursor:ns-resize}
.bwgrip.sw{left:-4px;bottom:-4px;width:14px;height:14px;cursor:nesw-resize}
.bwgrip.se{right:-1px;bottom:-1px;width:14px;height:14px;cursor:nwse-resize;
  background:linear-gradient(135deg,transparent 0 55%,var(--tx3) 55% 62%,transparent 62% 74%,var(--tx3) 74% 81%,transparent 81%)}
body.bwdrag{user-select:none;-webkit-user-select:none}
body.bwdrag *{cursor:inherit!important}
body.bw-mv{cursor:move} body.bw-ew{cursor:ew-resize} body.bw-ns{cursor:ns-resize}
body.bw-nesw{cursor:nesw-resize} body.bw-nwse{cursor:nwse-resize}
#bookwin.drag{opacity:.94}
.bwtool{display:flex;align-items:flex-start;gap:10px;margin-top:-4px}
.bwtool p{flex:1;margin:0;font-size:12.5px;color:var(--tx3)}
.bwtool .qbtn{flex:none}
/* 공모주 청약 — 주식 탭 위 카드 */
.ipo{border:1px solid var(--line);border-left:2px solid var(--map);background:var(--panel);padding:12px 14px;margin-bottom:14px}
.ipoh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ipoh b{color:var(--map);font-size:11.5px;letter-spacing:.06em;font-weight:600}
.ipoh span{font-size:14px;font-weight:600}
.ipoh small{font-size:11.5px;color:var(--tx3);font-weight:400;margin-left:6px;font-family:"IBM Plex Mono",monospace}
.ipoh em{margin-left:auto;font-style:normal;font-size:12px;color:var(--warn)}
.ipob{font-size:12.5px;color:var(--tx2);margin:6px 0 9px;line-height:1.6}
.ptag{display:inline-block;font-size:10.5px;color:var(--tx3);border:1px solid var(--line);padding:0 5px;margin-right:6px;vertical-align:1px;line-height:1.5}
.kv.ipokv{grid-template-columns:auto auto auto 1fr;gap:4px 16px;font-size:12.5px}
.kv.ipokv dt:nth-of-type(odd){min-width:0} .kv.ipokv dd:nth-of-type(odd){padding-right:22px}
.ipof{display:flex;align-items:center;gap:8px;margin-top:11px;flex-wrap:wrap}
.ipof input{width:92px;background:var(--bg);border:1px solid var(--line);color:var(--tx);padding:6px 9px;font-size:13px;font-family:"IBM Plex Mono",monospace;outline:none}
.ipof input:focus{border-color:var(--map)}
.ipof .unit{font-size:12px;color:var(--tx3);margin-left:-4px}
.ipof .act{--tc:var(--map)}
.ipon{font-size:11.5px;color:var(--tx3);margin-top:7px;line-height:1.6}
.bktabs{display:flex;gap:2px;flex-wrap:wrap;margin:-6px 0 16px;border-bottom:1px solid var(--line)}
.bktabs button{padding:8px 12px;font-size:13px;color:var(--tx3);border-bottom:2px solid transparent;margin-bottom:-1px}
.bktabs button.on{color:var(--tx);border-bottom-color:var(--warn)}
.dhead{font-size:12px;color:var(--tx3);font-family:"IBM Plex Mono",monospace;margin-bottom:6px}
.dtext{width:100%;min-height:150px;resize:vertical;background:var(--bg);border:1px solid var(--line);color:var(--tx);
  padding:10px 12px;font:inherit;font-size:13.5px;line-height:1.75;outline:none}
.dtext:focus{border-color:var(--mkt)}
.dchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;min-height:18px;font-size:12px}
.dpage{border-left:2px solid var(--line);padding:4px 0 4px 11px;margin-bottom:12px;font-size:13px}
.dpd{font-size:11px;color:var(--tx3);font-family:"IBM Plex Mono",monospace;margin-bottom:2px}
.dnote{color:var(--tx3);font-size:12.5px}
/* 캘린더 — 12월 13일부터 4월 11일까지. 알려진 것만 적힌다 */
.calwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.cm h5{font-size:12px;color:var(--tx2);margin:0 0 6px;font-weight:500}
.cw{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cw i{font-style:normal;font-size:10px;color:var(--tx3);text-align:center;padding:2px 0}
.cw i.out{opacity:.25}
.cd{min-height:40px;border:1px solid var(--line2);padding:2px 3px;text-align:left;display:flex;flex-direction:column;gap:1px;overflow:hidden}
.cd b{font-size:11px;font-weight:500;color:var(--tx2)}
.cd.past{opacity:.5} .cd.today{border-color:var(--warn);opacity:1} .cd.sel{background:rgba(63,197,216,.10)}
.cd.holi b{color:var(--up)}
.ce{font-size:9.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ce.up{color:var(--up)} .ce.warn{color:var(--warn)} .ce.mkt{color:var(--mkt)} .ce.work{color:var(--work)}
.ce.map{color:var(--map)} .ce.nuruk{color:var(--nuruk)} .ce.tx{color:var(--tx)} .ce.dim{color:var(--tx3)}
.cday{margin:0 0 16px;border-bottom:1px solid var(--line);padding-bottom:12px}
.cevs{display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:8px}
.cevs .ce{font-size:12px}
.cpage{font-size:13px;border-left:2px solid var(--line);padding-left:10px;margin-bottom:8px}
.cmemo{font-size:12.5px;color:var(--tx2);margin-bottom:8px}
.cmark{display:flex;gap:6px;margin-top:6px}
.cmark input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--tx);padding:6px 9px;font:inherit;font-size:13px}
.wrap{max-width:1120px;margin:0 auto}
.lifesep{display:flex;align-items:center;gap:12px;margin:26px 0 14px;
  font-size:12px;color:var(--tx3);letter-spacing:.06em}
.lifesep::before,.lifesep::after{content:"";flex:1;border-top:1px solid var(--line)}
h2.ph{font-size:16px;font-weight:600;margin:0 0 3px;color:var(--tc)}
p.pd{font-size:13.5px;color:var(--tx3);margin:0 0 18px}
.act{border:1px solid var(--tc);color:var(--tc);padding:7px 15px;font-size:12.5px;transition:.14s}
.act:hover:not(:disabled){background:var(--tc);color:var(--bg)}
.act:disabled{opacity:.32;cursor:not-allowed}
.hint{font-size:13px;color:var(--tx2);padding:15px;border:1px dashed var(--line);text-align:center}

.mkthead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.idx{font-size:12px;color:var(--tx2)}
table{border-collapse:collapse;width:100%;font-size:13px;table-layout:fixed}
th.c1{width:11%}th.c2{width:24%}th.c3{width:10%}th.c4{width:14%}th.c5{width:15%}th.c6{width:10%}th.c7{width:16%}
/* 창이 좁으면 이름·섹터는 말줄임 — 옆 칸으로 번지지 않게 */
td.cut{overflow:hidden;text-overflow:ellipsis}
th{font-size:11.5px;letter-spacing:0;color:var(--tx2);font-weight:500;text-align:right;
  padding:9px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
th.l{text-align:left}
td{padding:8px 7px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap;font-size:13.5px}
td.l{text-align:left}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--panel)}
tr.row.sel td{background:var(--panel2)}
.grp td{background:var(--panel);color:var(--tx2);font-size:11px;letter-spacing:0;
  text-align:left;padding:7px 9px}
.tk{font-family:"IBM Plex Mono",monospace;font-weight:600;letter-spacing:.04em}
.up{color:var(--up)} .dn{color:var(--dn)} .fl{color:var(--tx3)}
.hold{font-size:11px;color:var(--warn);font-family:"IBM Plex Mono",monospace}
.sigmark{font-size:10px;padding:0 4px;border:1px solid currentColor;margin-left:5px;vertical-align:1px}
/* 겹치면 방향을 말로 적고 색으로도 말한다. 갈리면 노랑 — 아무것도 확실하지 않다는 뜻 */
.sigmark.dup{font-weight:600;border-width:1.5px}
.sigmark.dup.up{background:rgba(255,91,74,.12)}
.sigmark.dup.dn{background:rgba(74,155,255,.12)}
.sigmark.split{color:var(--warn);border-color:var(--warn);
  background:rgba(255,216,74,.12);font-weight:600;border-width:1.5px}

#trade{margin-top:16px;border:1px solid var(--line);background:var(--panel)}
.tphead{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tpname{font-weight:600;font-size:15px}
.tpname small{color:var(--tx3);font-weight:400;font-size:11.5px;margin-left:8px}
.tpbody{padding:14px 15px;display:grid;gap:13px;grid-template-columns:1fr 262px}
.tpbio{padding:9px 15px 10px;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.65;color:var(--tx2)}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
let RNG=mulberry32(1);

function noiseOf(day,k){return nrand(S.seed+"|"+day+"|nz|"+k)}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

  const miss=hs.filter(h=>h.t==="miss").sort((a,b)=>(b.n||1)-(a.n||1))[0];
  hs.filter(h=>h.t!=="miss"&&h.t!=="warn"&&h.t!=="retire"&&HERO_PAPER[h.t]).concat(miss?[miss]:[]).forEach(h=>{

function rollSpev(seed){
  const r=mulberry32(hashStr(seed+"|spev")), ids=SPEV.map(e=>e.id);
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(r()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]}
  const n=8+Math.floor(r()*3), a=6, w=(114-a)/n;
  const L=ids.slice(0,n).map((id,i)=>({id,day:Math.round(a+w*i+r()*w*0.8)}));
  /* 원작대로 — 몰락자는 떨어진 탑에서 나온다. 탑이 있으면 이삼일 뒤 같은 구역에서 몰락자가 나오고,
     몰락자만 뽑혔으면 그 자리가 탑이 된다 */
  let T=L.find(e=>e.id==="tower"); const K=L.find(e=>e.id==="kids");
  if(!T&&K){K.id="tower"; T=K}
  else if(K)L.splice(L.indexOf(K),1);
  if(T){const r2=mulberry32(hashStr(seed+"|tower"));
    T.dist=SP_DIST[Math.floor(r2()*SP_DIST.length)];
    let d=T.day+2+Math.floor(r2()*3); while(L.some(e=>e.day===d))d++;
    L.push({id:"kids",day:d,dist:T.dist}); L.sort((x,y)=>x.day-y.day);}
  return L;
}

function rollThemes(seed){

  for(let i=ids.length-1;i>0;i--){const j=Math.floor(r()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]}
  const days=r()<0.5?[20+Math.floor(r()*81)]:[20+Math.floor(r()*36),66+Math.floor(r()*35)];
  return days.map((d0,i)=>({id:ids[i],d0,up:3+Math.floor(r()*4)}));
}

function themeMag(k){

/* ── 회차 ──

function rollArc(){
  const pool=VILLAINS.filter(v=>S.day>=v.st).map(v=>v.id);
  S.arcMiss=S.arcMiss||{};
  if(!pool.length){S.arc={s:S.day,L:20,cast:[],no:(S.arc?S.arc.no||1:0)+1};return}
  const want=Math.min(pool.length,2+Math.floor(RNG()*3));
  /* 안 나온 빌런은 다음 회차에 나올 확률이 오른다 — 한 번 거를 때마다 무게 +0.8 */
  const w=id=>1+0.8*(S.arcMiss[id]||0);
  const cast=[], p=pool.slice();
  while(cast.length<want&&p.length){
    let r=RNG()*p.reduce((a,id)=>a+w(id),0), i=0;
    for(;i<p.length-1;i++){r-=w(p[i]); if(r<=0)break}
    cast.push(p.splice(i,1)[0]);}
  pool.forEach(id=>{S.arcMiss[id]=cast.includes(id)?0:(S.arcMiss[id]||0)+1});
  S.arc={s:S.day,L:20+Math.floor(RNG()*9),cast,no:(S.arc?S.arc.no||1:0)+1};
}

const PRE_DAYS=30;
function preHistory(s,seed){
  const r=mulberry32(hashStr(seed+"|pre|"+s.k));
  const g=()=>{let u=0; while(!u)u=r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r())};
  const start=+(s.p0*Math.exp(Math.max(-0.30,Math.min(0.30,g()*0.12)))).toFixed(2);   // 첫날 시가
  const n=PRE_DAYS*4, sig=s.sig*0.40;
  const W=[0]; for(let i=1;i<=n;i++){const gap=i%4===0;                 // i번째 점이 시가면 그 앞은 밤이다
    W.push(W[i-1]+g()*sig*(gap?Math.sqrt(0.60):Math.sqrt(0.40/3)))}
  /* 실제 시장엔 되돌림이 있어서 한 달 내내 한쪽으로만 가지 않는다 — 다리의 출렁임을 0.7배로 눌러 그 결을 흉내 낸다 */
  const L0=g()*sig*Math.sqrt(PRE_DAYS)*0.40;                           // 30일 전엔 대충 이만큼 떨어져 있었다
  const pts=W.map((w,i)=>start*Math.exp((w-(i/n)*W[n])*0.70+(1-i/n)*L0));
  pts[n]=start;
  return pts.map(v=>Math.max(0.5,+v.toFixed(2)));                      // 마지막 점 = 첫날 시가
}

function startOp(v){
  const p=pick(v.plans), n=p.st.length;
  /* 강도는 길이가 고정이 아니다 — 4~6일 중 하나. 답사와 실행 사이가 매번 다르다 */
  const L=v.kind==="heist"?ri(4,6):p.L, lat=Math.floor(L*0.35);
  const span=L-1-lat, days=[];
  for(let i=0;i<n;i++) days.push(i===n-1?L-1:lat+Math.round(span*i/(n-1)));
  const uniq=[...new Set(days)].sort((a,b)=>a-b);
  while(uniq.length<n){const g=uniq[uniq.length-1]-1; if(!uniq.includes(g)&&g>=lat)uniq.push(g); else break}
  uniq.sort((a,b)=>a-b);
  return {id:v.id,plan:p.n,start:S.day,L,days:uniq,st:p.st,sc:p.sc,
          tg:p.tg||null,fx:p.fx||null,fired:[],lat};
}

/* ══════ 4.5 히어로 — 실패와 부재 ══════
   기업에는 폐지가 있지만 히어로에게는 없다. 대신 둘로 나눈다 —
   실패는 값을 떨어뜨리고(거래는 계속 열려 있다), 부재는 값을 멈춘다.
   다치는 것도 조사받는 것도 전부 실패 쪽이다. */
function heroSt(k){return (S.hero&&S.hero[k])||{st:"on",miss:0}}
function halted(k){return heroSt(k).st==="rest"}
/* 부상 중인 히어로는 나오긴 나온다 — 못 막을 뿐이다. 그래서 0.5명으로 센다 */
function lineAvail(line){
  return HERO_KEYS.filter(k=>HEROES[k].line===line).reduce((a,k)=>{
    const h=heroSt(k);
    return a+(h.st==="rest"||h.st==="gone"?0:h.st==="hurt"?0.5:1)},0);
}
/* 저지 확률 = 계열 기본 + 가용 인원 × 12%p − 규모. 상한 70% */
function stopRate(kind,sc){
  const line=KIND_LINE[kind]||"guard";
  return Math.max(0.05,Math.min(0.70,(KIND_BASE[kind]||.40)+0.12*lineAvail(line)-sc*0.10));
}
/* 그 계열에서 실제로 나간 사람. 계열이 비면 대타가 간다 — 대타는 거의 못 막는다 */
function responder(line){
  const up=k=>{const h=heroSt(k); return h.st!=="rest"&&h.st!=="gone"};
  const pickOf=a=>{const fit=a.filter(k=>heroSt(k).st==="on");
    const pool=fit.length?fit:a; return pool[Math.floor(RNG()*pool.length)]};
  const able=HERO_KEYS.filter(k=>HEROES[k].line===line&&up(k));
  /* 한 명뿐인 계열은 도시를 혼자 다 못 돈다 — 열에 넷은 딴 사람이 간다 */
  if(able.length>1||(able.length===1&&RNG()<0.60))return pickOf(able);
  const any=HERO_KEYS.filter(up);
  return any.length?pickOf(any):null;      // 아무도 없으면 정말 아무도 안 갔다
}
function heroShock(k,v){S.hshock[k]=(S.hshock[k]||0)+v}
/* 아무도 못 나갔으면 지면엔 순찰대가 적힌다 */
function heroName(k){return k&&HEROES[k]?HEROES[k].n:"순찰대"}
/* 실패의 계단 — 한 번 놓치면 −8~18%, 연속이면 더 깊다 */
/* ── 놀람으로 값을 매긴다 ──
   시장은 결과가 아니라 「예상과 얼마나 달랐나」에 반응한다.
   원래 잘 못 막는 걸 못 막으면 덜 빠지고, 막기 어려운 걸 막으면 크게 뛴다.
   p=그 사건의 저지 확률. 이렇게 하면 기대값이 0이 되고, 남는 건 연속 실패·부상의 꼬리뿐이다 —
   그래서 「혼자 파괴를 막는 도라」가 매 판 확정 공매도가 되지 않는다. */
const surpriseW=p=>({win:(1-p)/0.5, fail:p/0.5});
function heroFail(k,sc,sub,p){
  const h=S.hero[k]; h.miss=(h.miss||0)+1;
  const step=h.miss>=3?2.2:h.miss>=2?1.6:1;
  /* 계획서 값 그대로 — 한 번 놓치면 −8~18%, 대형이면 두 배.
     맡은 계열이 아닌데 대신 나갔다가 못 막았으면 시장은 절반만 탓한다 */
  const drop=(0.08+RNG()*0.10)*(sc>=0.9?2:1)*step*(sub?0.5:1)*surpriseW(p===undefined?.5:p).fail;
  heroShock(k,-Math.min(0.55,drop));
  h.last=S.day;
  S.hnews.push({k,t:"miss",n:h.miss,sc});
  /* 부상 보도 — 정지가 아니다. 며칠간 저지 확률만 떨어진다 */
  if(sc>=0.55&&h.st==="on"&&RNG()<(sub?0.11:0.22)){
    h.st="hurt"; h.until=S.day+ri(3,7);
    heroShock(k,-(0.10+RNG()*0.15));
    S.hnews.push({k,t:"hurt",d:h.until-S.day});}
  /* 협회 조사 — 평판이 크게 흔들렸을 때. 결과는 며칠 뒤 또 뉴스로 온다 */
  else if(h.st==="on"&&RNG()<0.09){
    h.st="probe"; h.until=S.day+ri(3,6);
    heroShock(k,-(0.15+RNG()*0.15));
    S.hnews.push({k,t:"probe",d:h.until-S.day});}
}
/* 막으면 뛴다 — 실패와 같은 폭에 놀람을 곱한다 */
function heroWin(k,sc,p){const h=S.hero[k]; h.miss=0; h.last=S.day;
  const w=surpriseW(p===undefined?.5:p).win;
  heroShock(k,sc>=0.55?(0.08+RNG()*0.10)*(sc>=0.9?2:1)*w:(0.01+RNG()*0.02)*w);}
/* 하루에 한 번 — 상태가 풀리고, 쉬러 갈 사람이 정해진다 */
function heroTick(){
  S.hnews=[];
  HERO_KEYS.forEach(k=>{
    const h=S.hero[k];
    if(h.st==="gone")return;                       // 은퇴 발표 후 정리 중 — 더 이상 출동하지 않는다
    /* 닷새를 안 놓치면 「요즘 왜 저러냐」가 한 칸 식는다 */
    if(h.miss>0&&S.day-(h.last||0)>=5){h.miss--; h.last=S.day}
    if((h.st==="hurt")&&S.day>=h.until){h.st="on"; S.hnews.push({k,t:"heal"})}
    else if(h.st==="probe"&&S.day>=h.until){
      const clear=RNG()<0.60;
      h.st="on"; heroShock(k,clear?(0.30+RNG()*0.40):-(0.35+RNG()*0.20));
      S.hnews.push({k,t:clear?"clear":"guilty"});}
    else if(h.st==="rest"&&S.day>=h.until){
      h.st="on"; h.miss=0;
      heroShock(k,RNG()<0.15?(0.30+RNG()*0.15):(RNG()*0.20));
      S.hnews.push({k,t:"back"});}
    /* 예고 — 「출동이 뜸하다」가 며칠 먼저 지면에 깔린다. 읽었으면 정리할 시간이 있었다 */
    if(h.restAt&&S.day>=h.restAt&&h.st!=="rest"){
      h.st="rest"; h.until=S.day+ri(14,28); h.restAt=0; h.warned=0;
      heroShock(k,-(0.10+RNG()*0.10));
      S.hnews.push({k,t:"rest",d:h.until-S.day});}
  });
  /* ── 은퇴 ── 한 판에 한두 번. 오래 지고 오래 낮았던 사람부터 떠난다.
     D+80까지 한 번도 없으면 가장 지친 사람이 떠난다 — 신인이 실제로 판에 들어와야 하니까 */
  if(S.retireLeft>0&&S.day>=30&&!Object.keys(S.retire).length&&!S.debutAt){
    const cand=HERO_KEYS.filter(k=>{const h=S.hero[k], L=S.lst[k];
      return h.st==="on"&&!h.restAt&&!(L&&L.kind==="debut"&&S.day-L.d<30)});
    const tired=k=>(S.hero[k].miss||0)*0.4+Math.max(0,1-S.price[k]/anchorOf(k))*3;
    if(cand.length){
      const top=Math.max(...cand.map(tired));
      /* 안전망은 판마다 다른 날 — 「D+81에 누가 은퇴한다」가 공략이 되면 안 된다 */
      const force=S.day>=70+(S.seed%21)&&S.retireLeft===S.retireMax;
      if(force||RNG()<0.010+0.020*top){
        const by=cand.slice().sort((a,b)=>tired(b)-tired(a));
        const k=by[RNG()<0.7||by.length<2?0:1];
        const h=S.hero[k]; h.st="gone"; h.restAt=0;
        S.retire[k]={at:S.day+6};                  // 내일부터 닷새가 정리 기간
        S.retireLeft--;
        heroShock(k,-(0.36+RNG()*0.33));           // 로그 −0.36~−0.69 ≈ −30~50%
        S.hnews.push({k,t:"retire"});}}}
  /* 오래 지고 오래 낮았던 사람이 쉬러 간다. 한 판에 두셋 */
  if(S.restLeft>0&&S.day>18&&!HERO_KEYS.some(k=>S.hero[k].restAt)){
    const worn=HERO_KEYS.filter(k=>{const h=S.hero[k];
      return h.st==="on"&&!h.restAt&&(h.miss>=3||S.price[k]<(S.lst[k]?S.lst[k].p:SM[k].p0)*0.55)});
    if(worn.length&&RNG()<0.11){
      const k=worn[Math.floor(RNG()*worn.length)];
      S.hero[k].restAt=S.day+ri(3,5); S.hero[k].warned=S.day; S.restLeft--;
      S.hnews.push({k,t:"warn"});}}
}
/* ══════ 4.7 은행 · 신용 · 살림 ══════
   단기 대출은 이름부터 단기다 — 오래 들고 있으면 안 되는 물건.
   신용은 대출과 무관한 것들로 매긴다. 대출을 갚아서 등급이 오르면 「빌려서 갚기」가 최적이 되니까.
   그래서 이 사람이 어떻게 사는지를 본다: 예금을 두는지, 집을 옮기는지, 살림을 들이는지, 글을 쓰는지. */
const LOAN_RATE=d=>d<=5?0.004:d<=10?0.008:0.016;     // 1~5일 · 6~10일 · 11~15일
const LOAN_DUN=10, LOAN_SEIZE=15, LOAN_COOL=7, DEBT_RATE=0.008, DEP_RATE=0.0015;
const BANK_DAY=30, BANK_WEEKS=3;
const CREDIT_G=[[110,"A",1.00],[75,"B",0.75],[45,"C",0.50],[20,"D",0.35],[0,"F",0.20]];
function newBank(){return {loan:null,debt:0,dep:0,depBase:0,depDay:0,cool:0,credit:0,opened:0,dun:0}}
function creditGrade(){const c=(S.bank||{}).credit||0; return CREDIT_G.find(g=>c>=g[0])}
/* 시기배수 — 처음엔 조금만, 달마다 늘어나서 D+100에 만개 */
function timeMul(){return S.day<30?0:S.day<60?0.25:S.day<90?0.50:S.day<100?0.75:1}
function bankOpen(){return S.day>=BANK_DAY&&(S.paidWeeks||0)>=BANK_WEEKS}
/* 한도 = 순자산 × 등급배수 × 시기배수 — 이미 빌린 건 순자산에서 빠져 있다 */
function loanCap(){
  if(!bankOpen())return 0;
  return Math.max(0,netWorth()*creditGrade()[2]*timeMul());
}
function credit(v,why){const B=S.bank; if(!B)return;
  B.credit=Math.max(0,Math.min(200,(B.credit||0)+v));
  if(why&&Math.abs(v)>=4)toast(`신용 ${v>0?"+":""}${v} — ${why}`,v>0?"var(--map)":"var(--up)");}
function canBorrow(){const B=S.bank;
  return bankOpen()&&!B.loan&&!(B.debt>0)&&S.day>=B.cool}
function borrow(amt){const B=S.bank;
  amt=Math.floor(Math.min(+amt||0,loanCap())*100)/100;
  if(!canBorrow()||amt<1)return false;
  B.loan={p:amt,bal:amt,d:S.day}; S.cash+=amt;
  toast(`단기 대출 ${fmt(amt)} Mk — 15일 안에 갚아야 한다.`,"var(--warn)");
  render(); return true;
}
/* 갚는다 — 다 갚은 날부터 7일은 다시 못 빌린다. 빌렸다 갚았다 굴리는 꼼수를 막는다 */
function repay(amt){const B=S.bank;
  const owe=B.loan?B.loan.bal:(B.debt||0); if(owe<=0)return false;
  amt=Math.min(+amt||0,owe,Math.max(0,S.cash)); if(amt<0.01)return false;
  S.cash-=amt;
  if(B.loan){B.loan.bal-=amt;
    if(B.loan.bal<0.005){B.loan=null; B.cool=S.day+LOAN_COOL; B.dun=0;
      toast(`대출을 다 갚았다. ${LOAN_COOL}일 동안은 다시 빌릴 수 없다.`,"var(--map)")}}
  else{B.debt-=amt; if(B.debt<0.005){B.debt=0; toast("빚을 다 갚았다.","var(--map)")}}
  render(); return true;
}
/* 예금 — 하루 0.15%. 그날 넣은 돈은 그날 이자가 없다. 잃지 않는다는 게 값이다 */
function deposit(amt){const B=S.bank;
  amt=Math.min(+amt||0,Math.max(0,S.cash)); if(!bankOpen()||amt<0.01)return false;
  S.cash-=amt; B.dep+=amt; B.depDay=S.day; render(); return true;
}
function withdraw(amt){const B=S.bank;
  amt=Math.min(+amt||0,B.dep); if(amt<0.01)return false;
  B.dep-=amt; B.depBase=Math.min(B.depBase,B.dep); S.cash+=amt;
  if(S.day-B.depDay<3)credit(-8,"넣은 지 사흘도 안 된 예금을 깼다");
  render(); return true;
}
/* 밤사이 은행 — 이자, 독촉, 집행. 갭 다음에 돈다(집행은 시가로 판다) */
function bankDesk(){const B=S.bank; if(!B)return;
  if(!B.opened&&bankOpen()){B.opened=S.day; toast("은행 창구가 열렸다. 단기 대출과 예금을 쓸 수 있다.","var(--map)")}
  /* 예금 이자 — 밤을 넘긴 돈에만 */
  if(B.depBase>0){const it=B.depBase*DEP_RATE; B.dep+=it;}
  if(B.dep>0&&B.depBase>=0.2*Math.max(1,netWorth()))credit(1);
  B.depBase=B.dep;
  if(B.debt>0)B.debt*=1+DEBT_RATE;                 // 빚에는 이자가 계속 붙는다
  if(S.cash<5)credit(-3);
  const L=B.loan; if(!L)return;
  const age=S.day-L.d;
  L.bal*=1+LOAN_RATE(age);
  if(age===LOAN_DUN&&!B.dun){B.dun=S.day; S.stress+=10; credit(-20,"독촉 문자가 왔다");
    S.mktNews.push({t:"dun",bal:L.bal,left:LOAN_SEIZE-age});}
  if(age>=LOAN_SEIZE)seize();
}
/* 강제 집행 — 들고 있는 걸 전부 시장가로 정리해서 갚는다. 모자라면 빚으로 남는다.
   정지된 종목은 팔 수 없으니 그대로 둔다 */
function seize(){const B=S.bank, L=B.loan;
  let got=0;
  STOCKS.forEach(s=>{const q=S.hold[s.k]; if(!q||halted(s.k))return;
    const px=S.price[s.k], sl=Math.min(0.5,slipRate(px*Math.abs(q),s.k));
    if(q>0){got+=px*q*(1-sl); S.cash+=px*q*(1-sl)}
    else{S.cash-=px*(-q)*(1+sl)}
    S.hold[s.k]=0;});
  S.queue=[];
  const pay=Math.min(Math.max(0,S.cash),L.bal);
  S.cash-=pay; let rest=L.bal-pay;
  /* 그래도 모자라면 보증금이 압류된다 — 집을 빼서 갚고, 구시가 반지하로 돌아간다 */
  if(rest>0.005&&(S.hdep||0)>0){const take=Math.min(S.hdep,rest); rest-=take; S.cash+=S.hdep-take;
    S.hdep=0; S.home="old"; S.hg=0; S.lostHome=S.day;
    toast("보증금까지 압류됐다. 구시가 반지하로 돌아간다.","var(--up)");}
  B.loan=null; B.cool=S.day+LOAN_COOL; B.dun=0;
  if(rest>0.005)B.debt=(B.debt||0)+rest;
  S.stress+=25; credit(-60,"강제 집행");
  S.mktNews.push({t:"seize",got,rest});
  toast(rest>0.005?`강제 집행 — 전부 팔고도 ${fmt(rest)} Mk가 빚으로 남았다.`:`강제 집행 — 보유 종목이 전부 정리됐다.`,"var(--up)");
}

  listStock(o.k,open,"ipo");
  Object.assign(S.lst[o.k],{p:o.F,ipo:o.P,open});          // 되돌림·관리 기준은 공정가, 첫날 등락은 공모가 대비
  Object.assign(S.mktNews[S.mktNews.length-1],{P:o.P,R});
  S.prev[o.k]=o.P;
  if(got>0){const h0=S.hold[o.k]||0; S.hold[o.k]=qr(h0+got); noteCost(o.k,h0,S.hold[o.k],o.P)}
  Object.assign(o,{R,open,eq:e2,pro:got-e2,got,back,done:true});
  if(o.q){S.mktNews.push({t:"ipome",k:o.k,got,eq:e2,pro:got-e2,back});
    memoPush(`청약 결과 — ${s.n} ${got?got+"주 배정":"배정 없음"} · 경쟁률 ${R} : 1 · ${fmt(back)} Mk 돌려받음`,"공모",true)}
}
/* 주식 탭 위 — 청약 받는 동안과 상장 전날까지 뜬다 */

      :`<div class="ipon">${live?"청약은 장중(아침·점심·오후)에만 받는다.":"청약 마감 — 상장 날 아침에 배정 결과가 나온다."}</div>`}</div>`}).join("");

/* 신인은 가장 얇은 계열을 메운다 — 방어·속도처럼 한 명뿐인 계열이 비면 거기부터 채운다 */
function debut(){
  const pool=HERO_POOL.map(s=>s.k).filter(k=>!S.everListed[k]);
  if(!pool.length)return;
  const thin=Math.min(...pool.map(k=>lineAvail(HEROES[k].line)));
  const c=pool.filter(k=>lineAvail(HEROES[k].line)===thin);
  const k=c[Math.floor(RNG()*c.length)];
  S.hero[k]={st:"on",miss:0,until:0,restAt:0,warned:0};
  listStock(k,SM[k].p0,"debut");
}
/* 회생 — 폐지 30일 뒤 한 번 20%, 실패하면 그다음 날부터 매일 5%. 폐지가의 30~60%에서 다시 시작 */
function relist(k){
  const D=S.delisted[k], p=+(D.px*(0.30+RNG()*0.30)).toFixed(2);
  delete S.delisted[k]; S.mgmt[k]={below:0,rec:0};
  listStock(k,Math.max(0.5,p),"re");
  S.mktNews[S.mktNews.length-1].was=D.px;
}
/* ── 기업 소식 ── 빌런도 히어로도 아닌, 회사 자체의 일.
   이게 없으면 사건 축에 한쪽으로 기운 서너 종목만 폐지된다 — 보험과 후원사가 매 판 죽는다.
   어느 회사든 맞을 수 있어야 「폐지」가 사건이 된다. 밤사이 터지고 갭에 실리고 조간에 난다 */
const CORP_BAD=[["{n}, 회계 처리 의혹으로 거래소 조회 공시 요구받아","감사인이 의견을 유보했다."],
 ["{n} 주력 공장 화재","생산 재개 시점은 밝히지 않았다."],
 ["{n} 대표 돌연 사임","회사는 「개인 사정」이라고만 밝혔다."],
 ["{n}, 주력 제품 전량 리콜 결정","비용 규모는 아직 집계 중이다."],
 ["{n}, 최대 거래처와 계약 해지","대체 거래처는 정해지지 않았다."],
 ["{n}, 대규모 유상증자 결정","기존 주주 지분이 크게 희석된다."]];
const CORP_GOOD=[["{n}, 협회와 3년 장기 계약 체결","업계 최대 규모다."],
 ["{n} 신규 사업 인가 획득","경쟁사 중 처음이다."],
 ["{n}, 자사주 대규모 매입 발표","소각 계획도 함께 밝혔다."],
 ["{n}, 대형 수주 공시","수주 잔고가 한 번에 두 배가 됐다."]];
function corpNews(force,fb){
  if(!force&&RNG()>=0.085)return;                                   // 열이틀에 한 번꼴
  const pool=STOCKS.filter(s=>{const L=S.lst[s.k];
    return s.g==="corp"&&!isMgmt(s.k)&&!(L&&L.kind!=="orig"&&S.day-L.d<5)});   // 갓 들어온 종목만 닷새 봐준다
  if(!pool.length)return;
  const s=pool[Math.floor(RNG()*pool.length)], bad=force?!!fb:RNG()<0.6;
  /* 크기는 그 회사의 체급을 따른다 — 보험사 같은 우량주는 기사 한 줄에 반토막 나지 않는다 */
  const sz=Math.max(0.55,Math.min(1.4,s.sig/0.09));
  const v=(bad?-(0.25+RNG()*0.40):(0.20+RNG()*0.25))*sz;    // 로그 — 보통 체급 악재 −22~−48%, 호재 +22~+57%
  heroShock(s.k,v);
  const [h,sub]=pick(bad?CORP_BAD:CORP_GOOD);
  S.mktNews.push({t:bad?"corpbad":"corpgood",k:s.k,hl:T(h,{n:s.n}),sub});
}
/* 밤사이 거래소 — 어제 종가로 판정한다. 갭보다 먼저 돈다 */
function marketDesk(){
  S.mktNews=[];
  dayRNG("desk");
  zoneTick();                   // 복구 기금이 바닥난 동안은 부서진 곳이 그대로다
  corpNews();
  if(DEV.desk)DEV.desk();       // 미리보기 — 그날 거래소에 끼워 넣을 소식
  finaleDesk();                 // 간밤이 최종장이었다 — 결과를 큰 특보로, 못 막았으면 파산과 피해 구역
  /* 은퇴 발표는 밤에 났다 — 조간에 같이 싣는다 */
  (S.hnews||[]).filter(h=>h.t==="retire").forEach(h=>S.mktNews.push({t:"retire",k:h.k,at:S.retire[h.k]&&S.retire[h.k].at}));
  if(isHoliday()){S.mktNews.push({t:"holi"}); calendarDesk(); specialEvents(); zoneEvict(); return}
  /* 관리종목 — 상장가 절반 아래로 닷새면 지정, 닷새 연속 절반 위면 해제, 열흘 안에 못 벗어나면 폐지 */
  STOCKS.filter(s=>s.g==="corp").slice().forEach(s=>{
    const k=s.k, ref=S.lst[k]?S.lst[k].p:s.p0, px=S.price[k];
    const m=S.mgmt[k]||(S.mgmt[k]={below:0,rec:0});
    if(m.left===undefined){
      m.below=px<ref*MG_LINE?m.below+1:0;
      if(m.below>=MG_DAYS){m.left=MG_LEFT; m.rec=0; m.since=S.day; S.mktNews.push({t:"mgmt",k})}
      return;}
    if(px>=ref*MG_LINE){if(++m.rec>=MG_REC){S.mgmt[k]={below:0,rec:0}; S.mktNews.push({t:"release",k}); return}}
    else m.rec=0;
    if(--m.left<=0)delist(k,"corp");});
  /* 은퇴한 히어로 — 정리 기간이 끝나면 사라지고, 며칠 뒤 신인이 들어온다 */
  Object.keys(S.retire).forEach(k=>{if(S.day>=S.retire[k].at){
    delete S.retire[k]; delist(k,"hero"); S.debutAt=S.day+ri(2,4);}});
  ipoDesk();
  S.listQ=S.listQ.filter(d=>{if(S.day>=d){ipoOpen();return false}return true});
  if(S.debutAt&&S.day>=S.debutAt){S.debutAt=0; debut()}
  Object.keys(S.delisted).forEach(k=>{const D=S.delisted[k];
    if(SM[k].g!=="corp"||S.day-D.d<30||D.why==="bankrupt")return;
    const p=D.tried?0.05:0.20; D.tried=true;
    if(RNG()<p)relist(k);});
  calendarDesk();
  themeDesk();                  // 제 씨앗을 따로 쓴다
  specialEvents();              // 맨 끝 — 제 씨앗을 따로 쓰니 위의 판정을 흔들지 않는다
  zoneEvict();                  // 통제된 곳에 있었다면 밖으로
}
/* ── 달력의 날 ── 크리스마스 퍼레이드, 히어로 시상식, 최종장 조짐. 거래소 소식과 같이 조간에 실린다 */
function calendarDesk(){
  dayRNG("cal");
  if(S.day===XMAS){
    HERO_KEYS.forEach(k=>{if(!halted(k))heroShock(k,0.02+RNG()*0.03)});
    S.mktNews.push({t:"xmas"}); addZone("new","parade",1,"xmas");}
  if(S.day===S.award){
    const rec=k=>S.hrec&&S.hrec[k]||{w:0,l:0}, sc=k=>rec(k).w-rec(k).l;
    const L=HERO_KEYS.filter(k=>!halted(k)&&S.hero[k]&&S.hero[k].st!=="gone").slice()
      .sort((a,b)=>sc(b)-sc(a)||rec(b).w-rec(a).w);
    if(L.length>=2){const top=L[0], low=L[L.length-1];
      heroShock(top,0.15+RNG()*0.10); heroShock(low,-(0.10+RNG()*0.08));
      S.mktNews.push({t:"award",k:top,low});}}
  const F=S.finale;
  if(F&&!F.v&&S.day>=F.day-7&&S.day<F.day){
    /* 그 판에서 계획을 가장 많이 성공시킨 빌런이 올라온다. 아무도 없으면 시드가 고른다 */
    const vs=S.vsucc||{}, ids=VILLAINS.map(v=>v.id), best=Math.max(0,...ids.map(i=>vs[i]||0));
    const top=ids.filter(i=>(vs[i]||0)===best);
    F.v=top[Math.floor(mulberry32(hashStr(S.seed+"|boss"))()*top.length)];
    F.sign=S.day; S.known[F.v]=true;
    S.mktNews.push({t:"fsign",v:F.v});
    pushAlert("fsign",F.day-S.day+1,{v:VM[F.v].n,op:(VM[F.v].hx||{}).op||"작전"});}
}
/* ── 밤 ──
   사건은 밤에 난다. 낮에는 아무 일도 일어나지 않고, 지면은 간밤의 일만 적는다.
   여기서 굴린 결과가 내일 아침 시가의 갭이 된다 — 그래서 밤에 알아도 늦다. */
function fireNight(){
  dayRNG("hero"); heroTick();
  dayRNG("night");
  const ev={destr:0,cas:0,hwin:0,scandal:0,reg:0}, fired=[];
  S.ops.forEach(o=>{
    const v=VM[o.id], off=S.day-o.start;
    if(o.days.includes(off)&&!o.fired.includes(off)){
      const step=o.days.indexOf(off);
      o.fired.push(off);
      const climax=(off===o.L-1);
      /* 강도의 답사는 소리 없이 지나간다 — 지면에도 밤에도 안 뜬다. 현장에 간 사람만 안다 */
      if(v.kind==="heist"&&!climax){o.scouted=S.day;return}
      const sc=o.sc[Math.min(step,o.sc.length-1)];          // 규모는 계획이 정한다
      const stage=o.st[Math.min(step,o.st.length-1)];       // 무대도 계획이 정한다
      const kind=v.kind||"wreck", line=KIND_LINE[kind];
      const resp=responder(line);
      /* 대타가 갔으면 계열 보정이 통째로 빠진다 — 그 계열은 지금 0명이나 마찬가지다 */
      const sub=!!resp&&HEROES[resp].line!==line;
      const pStop=sub?Math.max(0.05,(KIND_BASE[kind]||.40)-sc*0.10):stopRate(kind,sc);
      const win=pvWin(!!resp&&RNG()<pStop), dm=win?0.35:1;
      for(const a in v.ax){if(!v.ax[a])continue;
        ev[a]+=sc*((a==="destr"||a==="cas")?dm:1)*v.ax[a]*rr(.55,1)}
      ev.hwin+=(win?0.9:-1.1)*sc;
      if(resp){if(win)heroWin(resp,sc,pStop); else heroFail(resp,sc,sub,pStop)}
      if(resp){S.hrec=S.hrec||{}; const R=S.hrec[resp]=S.hrec[resp]||{w:0,l:0}; win?R.w++:R.l++}
      if(!win){S.vsucc=S.vsucc||{}; S.vsucc[o.id]=(S.vsucc[o.id]||0)+sc}
      const tg=o.tg||null;
      /* 털리면 표적에 붙은 종목이 직접 움직인다 — 막히면 아무 일도 없었던 것이 된다 */
      if(o.fx&&!win)for(const k in o.fx){
        const amt=o.fx[k]*(0.8+RNG()*0.4);
        if(k==="hero")HERO_KEYS.forEach(h=>heroShock(h,amt)); else heroShock(k,amt);}
      fired.push({t:"main",id:o.id,sc,win,step,kind,tg,sub,p:pStop,
                  phase:climax?"절정":(off<o.lat+1?"잠복":"전개"),
                  dist:stage,hero:resp||null,none:!resp});}});
  /* 잡범은 매일 한두 건. 도시가 살아 있게만 하고 큰 그림은 안 가린다.
     예전(하루 0.4건)보다 세 배 반 잦아졌으니 한 건이 시장과 위협지수를 흔드는 몫은 PW만큼 줄였다 —
     합치면 예전과 비슷하다. 모방범도 같은 비율로 줄였다 */
  const PW=0.35;
  /* 최종장 — 올라온 빌런의 도시 전체 작전. 120일 중 가장 큰 밤이다 */
  const F=S.finale;
  if(F&&F.v&&!F.done&&S.day===F.day){
    const v=VM[F.v], kind=v.kind||"wreck", line=KIND_LINE[kind], sc=1.6;
    const resp=responder(line), sub=!!resp&&HEROES[resp].line!==line;
    const pStop=Math.max(0.05,(sub?(KIND_BASE[kind]||.40)-0.16:stopRate(kind,1.0))-0.06);
    const win=pvWin(!!resp&&RNG()<pStop), dm=win?0.35:1;
    for(const a in v.ax){if(!v.ax[a])continue; ev[a]+=sc*((a==="destr"||a==="cas")?dm:1)*Math.max(.5,v.ax[a])*rr(.8,1)}
    ev.hwin+=(win?0.9:-1.1)*sc;
    if(resp){if(win)heroWin(resp,sc,pStop); else heroFail(resp,sc,sub,pStop)}
    if(!win&&kind==="heist")v.plans.forEach(pl=>{for(const k in (pl.fx||{})){const amt=pl.fx[k]*1.2*(0.8+RNG()*0.4);
      if(k==="hero")HERO_KEYS.forEach(h=>heroShock(h,amt)); else heroShock(k,amt);}});
    F.done=1; F.win=win; F.hero=resp||null; S.known[v.id]=true;
    fired.unshift({t:"main",id:v.id,sc,win,step:0,kind,tg:null,sub,p:pStop,phase:"절정",
      dist:pick(v.home),hero:resp||null,none:!resp,finale:1});}
  for(let i=DEV.noPetty?0:1+(RNG()<0.45?1:0)+(S.day===XMAS?2:0);i>0;i--){       // 크리스마스 밤엔 잡범이 는다
    const pf=S.pettyForce&&S.pettyForce.until>=S.day&&RNG()<0.75?PETTY.find(x=>x.n===S.pettyForce.n):null;
    const p=pf||pick(PETTY), sc=RNG()<.72?.18:(RNG()<.92?.30:.55);
    const win=RNG()<Math.min(0.90,0.72+0.10*lineAvail(KIND_LINE[p.kind||"wreck"])), dm=win?0.35:1;   // 방어 하나일 때 .82 — 예전 둘일 때와 같다
    ev[p.ax]+=sc*((p.ax==="destr"||p.ax==="cas")?dm:1)*rr(.5,1)*PW;
    ev.hwin+=(win?0.9:-1.1)*sc*0.5*PW;
    const kn=VILLAINS.filter(v=>S.known[v.id]&&!S.ops.some(o=>o.id===v.id));
    const mimic=S.day>53&&kn.length>0&&RNG()<0.07;
    fired.push({t:"minor",ax:p.ax,sc,win,petty:p,dist:pick(p.w),
                mimic,mimicOf:mimic?pick(kn).id:null});}
  if(!fired.length&&RNG()<0.35)ev.hwin+=rr(.05,.30);
  S.tonight={ev,fired,day:S.day};
  /* 내 집이 있는 구역이 맞으면 현금이 물리적으로 사라진다 — 주식 계좌는 무사 */
  const hit=fired.find(f=>f.dist===S.home&&f.sc>=0.4);
  if(hit){
    const rate=hit.win?0.10:(hit.sc>=0.9?0.55:0.28);
    const loss=S.cash*rate*(has("lock")?0.5:1)*HG_FX.guard[hg()]*(has("safe")?0:1);   // 도어락 절반 · 좋은 집일수록 덜 · 금고면 0
    if(loss>0.5){ S.cash-=loss; S.stress+=hit.win?5:(hit.sc>=0.9?26:12);
      S.homeHit={day:S.day+1,loss,sc:hit.sc,win:hit.win};}}
  /* 빌런이 더 자주 나오게 바뀐 만큼 한 건당 무게를 낮춘다.
     안 그러면 위협지수가 늘 경계에 붙어 있어서 등급이 의미를 잃는다. */
  const bump=fired.reduce((a,f)=>a+f.sc*10*(f.win?.35:1)*(f.t==="main"?1:.5*PW),0)
    +(F&&F.v&&!F.done&&S.day>=F.sign?4:0);                       // 최종장 조짐 — 위협지수가 매일 오른다
  S.threatPrev=S.threat;
  S.threat=Math.max(0,Math.min(100,20+(S.threat+bump-20)*0.92+gauss()*2.8));
  return S.tonight;
}
/* ── 아침의 갭 ──
   간밤의 사건이 전부 여기서 값에 실린다. 하루 분산의 60%가 이 한 번에 있다.
   장이 열리기 전에 벌어지므로 예약 주문은 갭을 그대로 받는다. */
const GAP_W=Math.sqrt(0.60), TICK_W=Math.sqrt(0.40/3);
/* 휴장 아침 — 값은 그대로 두고 점만 찍는다. 밤사이 사건은 쌓아 두었다가 다음 장 시가에 */
function holidayGap(){
  const ev=(S.tonight||S.today).ev;
  if(!S.carry)S.carry={ev:{destr:0,cas:0,hwin:0,scandal:0,reg:0},n:0,thr:S.threatPrev};
  AXES.forEach(a=>{S.carry.ev[a]+=ev[a]||0}); S.carry.n++;
  STOCKS.forEach(s=>{S.prev[s.k]=S.price[s.k]; S.hist[s.k].push(S.price[s.k])});
  S.tick=0;
  S.gap={day:S.day,moves:[],before:S.nwPrev,holi:HOLI[S.day]};
}
function applyGap(){
  dayRNG("price");
  const C=S.carry, ev0=(S.tonight||S.today).ev, ev={}, sup={};
  AXES.forEach(a=>{ev[a]=(ev0[a]||0)+(C?C.ev[a]:0)});
  AXES.forEach(a=>sup[a]=ev[a]-S.expect[a]);
  AXES.forEach(a=>S.expect[a]=S.expect[a]*0.85+ev[a]*0.15);
  const dthr=(S.threat-(C?C.thr:S.threatPrev))/100, mkt=0.0002+gauss()*0.014, nights=C?C.n+1:1;
  const moves=[];
  STOCKS.forEach(s=>{
    /* 정지된 히어로는 값이 갱신되지 않는다. 팔 수도 살 수도 없다 */
    if(halted(s.k)){S.prev[s.k]=S.price[s.k];S.hist[s.k].push(S.price[s.k]);return}   // 정지 — 점은 찍되 값은 그대로
    const L0=S.lst&&S.lst[s.k];
    if(L0&&L0.kind!=="orig"&&L0.d===S.day){S.prev[s.k]=L0.ipo||S.price[s.k];return}   // 상장 첫날 — 시초가에서 출발, 등락은 공모가 대비
    const sg=sigOf(s.k);
    /* 사건 항도 변동률과 같은 배수로 키운다 — 안 그러면 노이즈가 사건을 덮는다 */
    const imp=(AXES.reduce((a,x)=>a+(s.se[x]||0)*sup[x],0)*0.085+s.se.threat*dthr*0.9)*EV_SCALE;
    /* 로그 수익률. σ가 커지면 (1+r) 방식은 음수 가격이 나온다 */
    let r=s.dr*nights+0.5*mkt+noiseOf(S.day,s.k)*sg*GAP_W*Math.sqrt(nights);   // 휴장 뒤 첫 장은 밤 여러 개 몫
    /* 되돌림 — 변동이 큰 종목일수록 세게 당긴다.
       없으면 무냐 한 종목이 90일에 2,500배까지 가고 그 순간 게임이 끝난다.
       하루 체감은 σ가 지배하고, 되돌림은 몇 주 단위로만 느껴진다. */
    const anchor=anchorOf(s.k);
    r+=-(0.11*sg/0.50)*Math.log(S.price[s.k]/anchor);
    if(s.lag===0)r+=imp; else S.pending.push({d:S.day+s.lag,k:s.k,v:imp});
    S.pending=S.pending.filter(p=>{if(p.d<=S.day&&p.k===s.k){r+=p.v;return false}return true});
    /* 개별 충격 — 저지 실패·성공·부상·조사·복귀·강도 표적. 전부 갭에서 한 번에 벌어진다.
       로그로 더한다: +20%와 −20%를 퍼센트로 더하면 한쪽으로 샌다(1.2×0.8=0.96).
       그래서 막고 놓치기를 반복하는 것만으로 히어로주가 내려앉던 걸 막는다 */
    if(S.hshock&&S.hshock[s.k]){r+=Math.max(-0.9,Math.min(0.9,S.hshock[s.k]));}
    const was=S.price[s.k];
    S.prev[s.k]=was;
    S.price[s.k]=Math.max(0.5,was*Math.exp(r));
    S.hist[s.k].push(S.price[s.k]);
    moves.push({k:s.k,n:s.n,from:was,to:S.price[s.k],r:S.price[s.k]/was-1});});
  S.hshock={}; S.carry=null;
  S.tick=0;
  moves.sort((a,b)=>Math.abs(b.r)-Math.abs(a.r));
  S.gap={day:S.day,moves:moves.slice(0,3),before:S.nwPrev};
}
/* ── 장중 틱 ──
   아무것도 예고하지 않는다. 순수한 노이즈고, 화면이 움직이는 것 말고는 의미가 없다.
   그게 요점이다 — 흔들리는 걸 보고 따라가면 진다. */
function tickNoise(day,i,k){return nrand(S.seed+"|"+day+"|tk"+i+"|"+k)}
/* 차트는 틱마다 자란다 — 갭 하나 + 장중 셋 = 하루 네 점 */
function applyTick(i){
  const hol=isHoliday();
  STOCKS.forEach(s=>{
    if(!halted(s.k)&&!hol){
      const r=tickNoise(S.day,i,s.k)*sigOf(s.k)*TICK_W;
      S.price[s.k]=Math.max(0.5,S.price[s.k]*Math.exp(r));}
    S.hist[s.k].push(S.price[s.k]);});
}
/* 시간대가 앞으로 갈 때마다 밀린 틱을 채운다 — 어느 경로로 시간이 흘렀든 하루 세 번 */
function syncTicks(){
  if(!S)return;
  const want=Math.min(3,Math.max(0,S.t));
  while((S.tick||0)<want){S.tick=(S.tick||0)+1; applyTick(S.tick)}
}

/* ══════ 5. 뉴스 · 루머 ══════ */
/* 조사 — 앞 글자에 받침이 있는지로 고른다. 「무냐이 차단했다」 같은 게 안 나오게 */
function josa(w,pair){
  const c=String(w).replace(/[^가-힣a-zA-Z0-9]+$/,"").slice(-1);
  const code=c.charCodeAt(0);
  const bat = code>=0xAC00&&code<=0xD7A3 ? (code-0xAC00)%28!==0
            : /[0-9]/.test(c) ? "013678".indexOf(c)>=0        // 1·3·6·7·8·0은 받침 있음(일·삼·육·칠·팔·영)
            : /[a-zA-Z]/.test(c) ? "lmnr".indexOf(c.toLowerCase())>=0 : false;
  return bat?pair[0]:pair[1];
}
const JOSA={"이":"이가","가":"이가","은":"은는","는":"은는","을":"을를","를":"을를",
  "와":"과와","과":"과와","으로":"으로로","로":"으로로"};
/* {h}#이 처럼 쓰면 앞말에 맞춰 이/가를 고른다 */
const T=(s,m)=>s.replace(/\{(\w+)\}(#(이|가|은|는|을|를|와|과|으로|로))?/g,(_,k,__,j)=>{
  const v=m[k]!==undefined?m[k]:"";
  return !j?v:(j==="로"||j==="으로")?ro(v):v+josa(v,JOSA[j]);});   // 로/으로는 ㄹ 받침까지 본다
const pettyAct=n=>T(pick(PETTY_ACT),{n:"「"+n+"」"});
/* 내일의 고유 노이즈 = 오늘 보도할 수 있는 예측 재료 */
function tomorrowDir(k){return themeDir(k)||(noiseOf(S.day+1,k)>=0?1:-1)}
function tomorrowMag(k){return Math.abs(noiseOf(S.day+1,k))*sigOf(k)+themeMag(k)}

/* 내일 예상 변동폭을 3등급으로. 25%는 인접 등급으로 흔들린다 */
function gradeOf(k){
  const mag=tomorrowMag(k);
  let g = mag>=0.030?2 : mag>=0.013?1 : 0;
  if(RNG()<0.25) g=Math.max(0,Math.min(2,g+(RNG()<0.5?-1:1)));
  return g;
}
/* ── 뉴스 ──
   뉴스는 지나간 일만 적는다. 내일 방향은 여기 없다 — 갤러리·지도·장터에 있다.
   시간대에 따라 다루는 범위만 달라진다.
     장중(아침·점심·오후) : 어제 마감과 그 이유, 오늘 오전까지의 사실
     장마감(늦은 저녁·새벽) : 오늘 일어난 사건과 집계 */
/* 지면 수는 날마다 조금 다르다. 판이 바뀌어도 흔들리지 않게 씨앗으로 고정한다 */
const NEWS_N=()=>9+(hashStr(S.seed+"|n|"+S.day+"|"+(S.t<=2?0:1))%3);     // 9~11 — 잡범이 매일 들어온다
function pctTxt(v){return (v>0?"+":"")+v.toFixed(2)+"%"}
/* 석간 시황 — 오늘 업종별로 어떻게 끝났나. 장이 닫힌 뒤에 그 자리에서 잰다. 앞은 말하지 않는다 */
function closeNotes(){
  const g={};
  STOCKS.forEach(s=>{const k=s.g==="hero"?"히어로":s.s; (g[k]=g[k]||[]).push(chg(s.k))});
  const rows=Object.entries(g).filter(([,a])=>a.length).map(([k,a])=>({k,a,m:a.reduce((x,y)=>x+y,0)/a.length}))
    .sort((x,y)=>y.m-x.m);
  if(rows.length<2)return [];
  const one=(r,best)=>({tier:"시황",src:"거래소",cf:0,cls:"stat",
    hl:`${r.k} 업종 오늘 ${r.m>=0?"+":""}${r.m.toFixed(2)}% — ${best?"가장 많이 올랐다":"가장 많이 내렸다"}`,
    sub:`${r.a.length}종목 중 ${r.a.filter(x=>x>0).length}종목 상승, ${r.a.filter(x=>x<0).length}종목 하락.`});
  return [one(rows[0],true),one(rows[rows.length-1],false)];
}
function closeBoard(){
  const rows=STOCKS.map(s=>({k:s.k,n:s.n,c:chg(s.k)})).filter(x=>Math.abs(x.c)>0.01)
    .sort((a,b)=>b.c-a.c);
  if(rows.length<2)return null;
  return {up:rows.slice(0,3),dn:rows.slice(-3).reverse()};
}
function statusItem(night,used){
  /* 같은 지면에 같은 꼭지가 두 번 나가면 그 순간 신문이 아니게 된다 */
  let S0=pick(STATUS);
  if(used){for(let i=0;i<8&&used.has(S0.h);i++)S0=pick(STATUS); used.add(S0.h)}
  const d=pick(DISTRICTS).n;
  const a=ri(S0.r[0][0],S0.r[0][1]);
  /* 「N건 중 M건」에서 M이 N과 같아지면 기사가 안 된다 */
  const b=S0.r[1]?ri(S0.r[1][0],Math.max(S0.r[1][0],Math.min(S0.r[1][1],a-1))):0;
  const f=x=>T(x,{d,a,b,t:night?"오늘":"어제",e:RNG()<0.5?"늘었다":"줄었다"});
  return {tier:"현황",src:pick(PRESS.stat),cf:0,cls:"stat",hl:f(S0.h),sub:f(S0.s)};
}
/* 기사 하나를 신문답게 만든다 — 매체를 고르고, 가끔 인용과 바이라인을 붙인다 */
function dress(it,kind,night){
  it.src=pick(PRESS[night&&kind==="brk"?"brkN":kind]||PRESS.fill);
  const q=QUOTE[kind];
  if(q&&RNG()<0.42){const [w,l]=pick(q); it.q=w+josa(w,"은는")+" "+l}
  if(RNG()<0.28&&kind!=="dsc"&&kind!=="dsh"&&kind!=="board")it.by=byline();   // 공시엔 기자 이름이 안 붙는다
  if(kind==="fill"&&RNG()<0.45)it.sub="";      // 짧은 소식은 제목만
  return it;
}
function buildFeeds(){
  dayRNG("feed");
  S.news=[]; S.rumors=[];
  const H=shutAt(S.where)?{}:HUB[S.where]||{};

  /* ── 오늘 사건 (장마감에 읽는 것) ── */
  const brk=[], alertN=[];
  S.today.fired.slice(0,5).forEach(f=>{
    if(f.t==="main"){
      /* 「누가 막으러 갔나」는 그날 실제로 나간 사람이다 — 정해진 천적은 없다 */
      const v=VM[f.id], h=heroName(f.hero), d=DM[f.dist].n;
      if(f.hero){
        S.heroSeen=S.heroSeen||{}; S.heroSeen[f.hero]=(S.heroSeen[f.hero]||0)+1;
        (S.heroLog=S.heroLog||[]).push({k:f.hero,d:f.dist,win:f.win,sc:f.sc,day:S.day});
        if(S.heroLog.length>24)S.heroLog.shift();}
      if(f.finale){const X=v.hx||{}, op=X.op||"작전";
        alertN.push(dress({tier:"특보",cf:0,cls:"alert",dist:f.dist,
          hl:f.win?T("「{v}」 도시 전체 {op} — {h}#이 끝내 막아섰다",{v:v.n,h,op}):`「${v.n}」 도시 전체 ${op} — 협회 최고 경보`,
          sub:f.win?"피해는 생각보다 적었다. 도시가 한숨 돌렸다.":(X.finLose||"어디까지 번졌는지 아직 아무도 모른다.")},"alert"));
        return;}
      if(f.kind==="heist"){
        const tg=f.tg?"「"+f.tg+"」":d, X=v.hx;
        brk.push(dress({tier:"속보",cf:0,cls:"brk",dist:f.dist,
          hl:T(pick(f.win?(X?X.win:HEIST_HL.win):(X?X.lose:HEIST_HL.lose)),{tg,h}),
          sub:T(pick(f.none?HEIST_SUB.none:f.win?(X?X.subWin:HEIST_SUB.win):(X?X.subLose:HEIST_SUB.lose)),{h})},"brk"));
        return;}
      const truthful=RNG()<0.80;
      const ph=truthful?f.phase:pick(["잠복","전개"]);
      brk.push(dress({tier:"속보",cf:0,cls:"brk",dist:f.dist,
        hl:T(pick(BREAKING[ph]),{d,h,v:v.n}),
        sub:T(pick(f.win?BREAK_SUB.win:BREAK_SUB.lose),{h})},"brk"));
    }else{
      const p=f.petty||{n:"미상",d:""}, seen=S.pettySeen=S.pettySeen||{}, first=!seen[p.n]; seen[p.n]=1;
      brk.push(dress({tier:"단신",cf:0,cls:"brk",dist:f.dist,
        hl:`${DM[f.dist].n}에서 ${pettyAct(p.n)}`,
        sub:(first&&p.d?p.d+" ":"")+pick(f.win?PETTY_END.win:PETTY_END.lose)},"petty"));}});

  /* ── 휴식 예고 ── 쉬러 갈 사람은 며칠 전부터 지면에 비친다 */
  const hint=[];
  HERO_KEYS.forEach(k=>{const hs=heroSt(k);
    if(hs.restAt&&hs.restAt>S.day&&RNG()<0.75)
      hint.push(dress({tier:"단신",cf:0,cls:"fill",k,
        hl:T(pick(REST_HINT),{h:HEROES[k].n}),sub:""},"fill"));});

  /* ── 어제 왜 움직였나 (장중에 읽는 것) ── */
  const moved=STOCKS.map(x=>({s:x,c:chg(x.k)})).filter(x=>Math.abs(x.c)>0.2)
    .sort((a,b)=>Math.abs(b.c)-Math.abs(a.c));
  const cause=shuf(moved.slice(0,8)).slice(0,3+(H.disc||0)).map(({s:x,c})=>{
    const tbl=CAUSE[x.g==="hero"?"hero":x.s];
    return dress({tier:"공시",cf:0,cls:"dsc",k:x.k,
      hl:T(pick(c>0?tbl.up:tbl.dn),{n:x.n,p:pctTxt(c)}),
      sub:`${x.k} · 시가 ${fmtP(S.price[x.k])}${x.lag?` · 반영 지연 D+${x.lag}`:""}`},x.g==="hero"?"dsh":"dsc");});

  /* ── 백서 ── */
  const papers=[];
  S.papers.filter(p=>p.due<=S.day).forEach(p=>{
    const v=VM[p.vid], ok=RNG()<0.92;
    if(ok){
      S.known[p.vid]=true;
      const t=trackOp(p.vid,"백서"); v.sig.forEach(x=>{if(!t.sig.includes(x))t.sig.push(x)});
      t.plans=t.plans||[]; if(p.plan&&!t.plans.includes(p.plan))t.plans.push(p.plan);
      papers.push({tier:"백서",src:pick(PRESS.paper),cf:0,cls:"paper",plan:p.plan,
        hl:`사후 보고서 — ${t.label}의 정체는 「${v.n}」이었다`,
        sub:`시그니처 ${v.sig.length}종이 관측 기록에 등록됐다.`});
      memoPush(`${t.label} = 「${v.n}」 (협회 백서)`,"백서",true);
    }else{
      papers.push({tier:"백서",src:pick(PRESS.paper),cf:0,cls:"paper",
        hl:`사후 보고서 — ${S.tracked[p.vid]?S.tracked[p.vid].label:"미상 정황"}, 주체 특정 실패`,
        sub:"협회도 배후를 밝히지 못했다. 다음 작전을 기다려야 한다."});
      p.due=S.day+PAPER_DELAY; return;}
  });
  S.papers=S.papers.filter(p=>p.due>S.day);

  /* ── 분석: 지나간 국면을 되짚는다. 다음을 말하지 않는다 ── */
  const ana=[];
  const live=S.ops.filter(o=>S.tracked[o.id]);
  if(live.length&&RNG()<0.7){
    const o=pick(live), nm=opName(o.id);
    const age=S.day-o.start+1;
    const hint=S.known[o.id]
      ? `아카이브 대조 — 이 계열은 ${Object.entries(SECT_HINT[o.id]||{}).map(([g,d])=>`${g} ${d}`).join(", ")||"아직 표본이 없다"}이 먼저 반응했다.`
      : "주체는 아직 특정되지 않았다.";
    ana.push(dress({tier:"분석",cf:0,cls:"ana",opId:o.id,
      hl:`${nm}, ${age}일째 이어지고 있다`, sub:hint},"ana"));
  }else{
    const a=pick(ANALYSIS);
    ana.push(dress({tier:"분석",cf:0,cls:"ana",hl:a.t, sub:a.s},"ana"));
  }

  /* ── 잡보 ── */
  const fill=[], fillX=[], usedF=new Set();
  /* 철 지난 기사는 거른다 — 첫눈은 12월에만 */
  const fillPool=FILLER.filter(f=>f[2]!=="dec"||dateOf(S.day).getUTCMonth()===11);
  const oneFill=()=>{let f=pick(fillPool); for(let i=0;i<6&&usedF.has(f[0]);i++)f=pick(fillPool); usedF.add(f[0]);
    return dress({tier:"단신",cf:0,cls:"fill",hl:f[0],sub:f[1]},"fill")};
  /* 근황 — 상장된 히어로 하나의 사는 얘기. 값과는 상관없다 */
  const oneGossip=()=>{const hs=STOCKS.filter(s=>s.g==="hero"); if(!hs.length)return oneFill();
    const s=pick(hs), own=GOSSIP_HERO[s.k], g=own&&RNG()<0.4?pick(own):pick(GOSSIP);
    if(usedF.has(T(g[0],{h:s.n})))return oneFill(); usedF.add(T(g[0],{h:s.n}));
    return dress({tier:"근황",cf:0,cls:"fill",k:s.k,hl:T(g[0],{h:s.n}),sub:g[1]},"ent")};
  for(let i=ri(1,2);i>0;i--)fill.push(RNG()<0.45?oneGossip():oneFill());
  for(let i=0;i<4;i++)fillX.push(i===1?oneGossip():oneFill());       // 지면이 비는 날 채울 몫 — 첫날 아침처럼

  /* ── 현황 ── 장중용과 장마감용을 따로 굴린다. 시제가 다르다 ── */
  const stat=[],statN=[];
  const usedS=new Set();
  for(let i=0;i<3;i++)stat.push(dress(statusItem(false,usedS),"stat"));
  for(let i=0;i<5;i++)statN.push(dress(statusItem(true,usedS),"stat",1));
  const q=pick(QUIET_NIGHT), quiet=dress({tier:"단신",cf:0,cls:"fill",hl:q[0],sub:q[1]},"fill");
  const deskAll=(S.mktNews||[]).filter(x=>!mktLine(x).private).map(x=>{const m=mktLine(x);
    return {tier:m.tier||"거래소",src:m.src||"거래소 공시",cf:0,cls:m.big?"alert":m.a2?"alert2":m.soft?"dsc":"brk",k:x.k,hl:m.hl,sub:m.sub,big:!!m.big,soft:!!m.soft,a2:!!m.a2}});
  /* 큰 특보는 지면 맨 위로, 방송·경제 소식은 제 면으로, 나머지(거래소 공지)는 그대로 */
  const alert=alertN.concat(deskAll.filter(x=>x.big),deskAll.filter(x=>x.a2),followNews()),
    soft=deskAll.filter(x=>x.soft), desk=deskAll.filter(x=>!x.big&&!x.soft&&!x.a2);

  /* board는 갭 직후에 찍는다 — 「밤사이 등락」. 석간의 「오늘 마감」은 그때 다시 잰다 */
  S.newsPool={alert,soft,brk,hint,quiet,desk,hero:heroPaper(),cause,papers,ana,fill,fillX,stat,statN,board:closeBoard()};
  buildRumors();
}
/* 시간대가 무엇을 읽게 할지 정한다 */
/* 신문은 하루에 두 판 난다. 장중판과 마감판. 판이 다르면 다시 사야 한다. */
const edition=()=>S.t<=2?"조간":"석간";
/* 사건은 밤에 난다. 그래서 —
   조간 = 간밤에 벌어진 일 + 그 때문에 벌어진 시가(밤사이 등락). 방금 본 갭의 이유가 여기 있다.
   석간 = 오늘 장이 어떻게 끝났나. 낮에는 사건이 안 나니까 시황과 집계가 지면을 채운다. */
function newsNow(){
  const P=S.newsPool; if(!P)return [];
  const open=S.t<=2, out=[];
  out.push(...(P.alert||[]));            // 큰 특보는 조간이든 석간이든 맨 위
  if(open){
    out.push(...P.brk);
    out.push(...(P.desk||[]));
    out.push(...(P.hero||[]));
    out.push(...(P.hint||[]));
    if(P.board&&!isHoliday())out.push({tier:"시가",src:"거래소",cf:0,cls:"board",board:P.board,
      hl:"밤사이 등락", sub:""});
    out.push(...P.cause);
    out.push(...P.papers);
    out.push(...P.ana);
    out.push(...(P.soft||[]));
    out.push(...P.stat.slice(0,2));
    if(!P.brk.length&&P.quiet)out.push(P.quiet);     // 아무 일 없던 밤은 단신 한 줄
    out.push(...P.fill);
  }else{
    const b=closeBoard();
    if(b)out.push({tier:"마감",src:"거래소",cf:0,cls:"board",board:b,hl:"오늘 마감",sub:""});
    out.push(...closeNotes());
    out.push(...(P.desk||[]).slice(0,1));
    out.push(...(P.statN||[]));
    out.push(...P.ana);
    out.push(...P.papers);
    out.push(...(P.hint||[]).slice(0,1));
    out.push(...P.cause.slice(0,2));
    out.push(...P.fill.slice(0,1));
  }
  const want=NEWS_N();
  for(const f of (P.fillX||[])){if(out.length>=want)break; out.push(f)}
  return out.slice(0,want);
}

      if(i<tp.length&&(mix.length%3!==2||j>=rest.length))mix.push(tp[i++]); else mix.push(rest[j++]);}
    S.rumors=mix;}
  S.rumors.forEach(r=>{r.rep=replies(r)});
}
/* ── 댓글 ──
   댓글러도 각자 자기 정확도로 의견을 만든다. 원글과 같으면 맞장구, 다르면 반박.
   그러니까 적중률 높은 고정닉이 밑에 「ㄴㄴ」를 달았다면 원글이 틀렸을 확률이 높다.
   게임은 이 사실을 어디에도 적어두지 않는다. */
function replies(r){
  const n = r.kind==="evt" ? ri(1,5) : r.kind==="stock" ? ri(0,4) : r.rp ? ri(1,4) : r.rt||r.kind==="sig" ? ri(0,3) : ri(0,2);
  const out=[];
  for(let i=0;i<n;i++){
    const drift=RNG()<0.68;
    const a=drift?{id:"_d",n:dnick(),acc:.47,drift:1}:pick(AUTHORS);
    if(r.kind==="evt"){out.push({a,txt:RNG()<0.80?pick(EVT_REPLY[r.tone]||EVT_REPLY.alarm):pick(REPLY_NOISE)});continue}
    if(r.rp){out.push({a,txt:RNG()<0.80?T(pick(r.rp),r.rm||{}):pick(REPLY_NOISE)});continue}
    if(r.kind!=="stock"){
      const pool=r.kind==="sig"?REPLY_BY.sig:r.kind==="echo"?REPLY_BY.news:REPLY_BY[r.rt];
      out.push({a,txt:pool&&RNG()<0.75?pick(pool):pick(REPLY_NOISE)});continue}
    if(RNG()<0.36){out.push({a,txt:pick(REPLY_NOISE)});continue}
    const real=tomorrowDir(r.k), my=RNG()<a.acc?real:-real;
    out.push(my===r.dir
      ? {a,txt:pick(REPLY_AGREE),st:1}
      : {a,txt:T(pick(REPLY_DENY),{o:my>0?"오를 거":"내릴 거",os:my>0?"오르는 쪽":"내리는 쪽"}),st:-1});
  }
  return out;
}
/* 누룩은 방향이 아니라 "내일 가장 크게 움직일 종목"을 찍는다.
   기준선은 1/14 = 7%이므로 38%는 실제로 의미가 있다.
   방향은 부수적이고 약하다 — 공시(방향)와 역할이 겹치지 않게 한다. */
function rollNuruk(){
  if(nurukAway()){S.nurukPick=null;return}
  const acc=S.mood>=80?.52:S.mood>=50?.38:S.mood>=20?.26:0;
  if(!acc){S.nurukPick=null;return}
  const ranked=STOCKS.slice().sort((a,b)=>tomorrowMag(b.k)-tomorrowMag(a.k));
  const s=RNG()<acc?ranked[0]:pick(STOCKS);
  const dAcc=S.mood>=80?.62:.56, real=tomorrowDir(s.k);
  const m=S.mood>=80?"good":S.mood>=50?"ok":"low";
  S.nurukPick={k:s.k,dir:RNG()<dAcc?real:-real,showDir:S.mood>=50,
               mood:m,si:Math.floor(RNG()*NURUK_SAY[m].length)};
}

/* ══════ 5-b. 정황 추적 — 정체는 M3(백서)까지 비공개 ══════ */
const LBL="ABCDEFGH", PAPER_DELAY=14;
function trackOp(id,how){
  if(!S.tracked[id]){
    S.tracked[id]={label:"정황 "+LBL[S.nextLabel++],first:S.day,sig:[],hits:0,log:[],seen:0,recent:[]};}
  const t=S.tracked[id]; t.seen++; t.last=S.day; t.via=how;
  return t;
}
/* 해금된 빌런의 시그니처는 즉시 알아본다 — 아카이브의 본체 */
function sigOwner(txt){
  for(const v of VILLAINS) if(S.known[v.id]&&v.sig.includes(txt))return v.id;
  return null;
}
function opName(id){return S.known[id]?VM[id].n:(S.tracked[id]?S.tracked[id].label:"미상")}
/* 갤러리 글은 정황을 「등록」하지 않는다. 이미 현장에서 잡아둔 것에만 목격 기록을 더한다.
   등록은 오직 현장 조사로만 — 게임이 대신 정리해 주면 알아챌 것이 없어진다. */
function noteSigns(){
  S.rumors.forEach(r=>{
    if(r.kind!=="sig")return;
    const owner = r.real&&r.vid ? r.vid : sigOwner(r.txt);
    if(!owner||!S.tracked[owner])return;
    const t=S.tracked[owner];
    if(!t.sig.includes(r.txt))t.sig.push(r.txt);
    t.hits++;
    if(!t.recent.includes(S.day))t.recent.push(S.day);
    if(t.recent.length>8)t.recent.shift();});
}
/* 최근 4일간 징후를 며칠에 걸쳐 봤나 — 모방범(하루짜리)을 가려내는 유일한 단서 */
function sigStreak(id){const t=S.tracked[id]; if(!t)return 0;
  return t.recent.filter(d=>S.day-d<4).length}
/* 사건이 터진 날의 섹터 반응을 정황별로 기록 — M3 아카이브의 전신 */
function logSectors(snap){
  const sect={};
  STOCKS.forEach(s=>{if(!snap[s.k])return;          // 오늘 새로 들어온 종목은 어제가 없다
    const g=s.g==="hero"?"히어로":s.s;
    (sect[g]=sect[g]||[]).push((S.price[s.k]/snap[s.k]-1)*100)});
  const row={};
  for(const g in sect)row[g]=sect[g].reduce((a,b)=>a+b,0)/sect[g].length;
  S.today.fired.forEach(f=>{
    if(f.t!=="main")return;
    const t=S.tracked[f.id]; if(!t)return;
    t.log.push({day:S.day,phase:f.phase,win:f.win,m:row});
    if(t.log.length>12)t.log.shift();});
}
function opAge(id){const o=S.ops.find(x=>x.id===id);return o?S.day-o.start+1:null}
function opEvents(id){const o=S.ops.find(x=>x.id===id);return o?o.fired.length:0}

/* ── 수첩 ── 소지품·메모·내 글·관측 기록·캘린더. 마지막에 본 탭을 기억한다.

const BOOK_TABS=[["bag","소지품"],["memo","메모"],["diary","내 글"],["ach","관측 기록"],["cal","캘린더"]];

function calEvents(d){          // [칸 밖에서 쓰는 말, 색, 칸 안의 짧은 말]

function noteCost(k,h0,h1,fill){
  S.cost=S.cost||{}; const c0=S.cost[k];
  if(Math.abs(h1)<QSTEP){delete S.cost[k];return}
  if(h0===0||Math.sign(h0)!==Math.sign(h1)){S.cost[k]=fill;return}          // 새로 잡았거나 방향이 뒤집혔다

  if(Math.abs(h1)>Math.abs(h0))S.cost[k]=(c0*Math.abs(h0)+fill*(Math.abs(h1)-Math.abs(h0)))/Math.abs(h1);   // 같은 방향으로 늘렸다

function execTrade(k,dir,q,quiet){
  if(halted(k)){if(!quiet)toast(`${k} 거래 정지 — 체결되지 않았다.`,"var(--warn)");return false}
  const px=S.price[k], gross=px*q, sl=slipRate(gross,k), h0=S.hold[k]||0;
  if(dir>0){                                   // 매수 = 롱 진입 또는 숏 환매
    const cost=gross*(1+sl);
    if(cost>S.cash){if(!quiet)toast("현금이 모자란다.","var(--up)");return false}
    if(S.hold[k]<0&&S.sEntry&&S.sEntry[k]>px)unlock("short");   // 싸게 환매 = 공매도 수익
    S.cash-=cost; S.hold[k]=qr(S.hold[k]+q); noteCost(k,h0,S.hold[k],px*(1+sl));
    if(!quiet)toast(`${k} ${qs(q)}주 ${S.hold[k]<=0?"환매":"매수"} · ${fmt(cost)} Mk`,"var(--up)");
  }else{                                       // 매도 = 롱 청산 또는 공매도 진입
    const newShort=Math.max(0,q-Math.max(0,S.hold[k]))*px;

      if(!quiet)toast("공매도 한도 초과 — 순자산의 1배까지만 된다.","var(--dn)");return false}

  return true;
}

function sightOf(o,leftDays){
  /* 강도는 4~6일이라 단계를 촘촘히 — 답사 · 준비 · 임박 */
  const ph = o.tg ? (leftDays<=1?"late":leftDays<=2?"mid":"early")
           : leftDays<=2 ? "late" : leftDays<=5 ? "mid" : "early";
  const pool=(SIGHT[o.id]||{})[ph]||["뭔가 있었는데 뭔지 모르겠다."];
  let txt=pick(pool);
  const nx=nextStep(o);
  if(nx&&RNG()<0.55)txt+=" "+DIST_LEAK[nx.dist];
  /* 강도는 표적 이름이 새어 나온다 — 맞는 곳에 서 있을 때만 */
  if(nx&&o.tg&&RNG()<0.60)txt+=` 「${o.tg}」 얘기가 두 번 나왔다.`;
  return txt;
}

  S.readNews=false;S.readRumor=false;S.nurukFed=false;S.petCount=0;S.moved=false;

  if(S.mood>=95)unlock("pet");
  if(S.where==="ruin"){S.ruinDays++;if(S.ruinDays>=10)unlock("ruin")}
  const closing=S.ops.filter(o=>S.day-o.start>=o.L);
  closing.forEach(o=>{const t=S.tracked[o.id]; if(t){t.closed=(t.closed||0)+1;t.open=false}
    if(!S.known[o.id]&&!S.papers.some(p=>p.vid===o.id))
      S.papers.push({vid:o.id,plan:o.plan,due:S.day+PAPER_DELAY});});
  S.ops=S.ops.filter(o=>S.day-o.start<o.L);
  /* 간밤의 사건이 오늘 지면의 재료가 되고, 그 충격은 오늘 시가에 실린다 */
  if(S.tonight)S.today=S.tonight;
  marketDesk();                 // 어제 종가로 지정·폐지·상장을 먼저 처리하고
  if(isHoliday())holidayGap(); else applyGap();
  bankDesk();                   // 이자·독촉·집행 — 집행은 시가로 판다
  S.tonight=null;
  rollDay(false);
  S.ops.forEach(o=>{if(S.tracked[o.id])S.tracked[o.id].open=true});
  nurukRunaway();
  logSectors(snap);
  informant();                  // 정보원 — 일당을 받고 정해 둔 구역을 본다
  fanReact();                   // 응원하던 히어로가 간밤에 어땠나
  // 예약 주문 체결
  const hol=isHoliday(), q=hol?[]:S.queue; if(!hol)S.queue=[];     // 휴장 날엔 예약이 다음 장까지 기다린다
  /* 상주 리스크 — 위험한 자리를 지키는 값은 매일 치른다 */
  if(S.day>S.sickUntil&&riskOf(S.where)>=2&&!DEV.quiet){      // 미리보기로 굴리는 날엔 안 다친다
    dayRNG("stay"+S.where);
    if(RNG()<0.007*(riskOf(S.where)-1)*(1+S.threat/120))hurt();}
  /* 자동 관찰은 없앴다 — 현장 정보는 직접 조사해야 얻는다(probe) */
  if(S.homeHit&&S.homeHit.day===S.day){
    toast(`${DM[S.home].n}이 피해를 입었다. 현금 ${fmt(S.homeHit.loss)} Mk 손실`,"var(--up)");}
  if(wentOut&&S.day>S.sickUntil)toast(`${DM[S.home].n}으로 돌아왔다.`,"var(--map)");
  if(S.day===S.sickUntil+1&&S.sickUntil)toast("퇴원했다.","var(--map)");
  q.forEach(o=>{
    if(execTrade(o.k,o.dir,o.q,true))
      toast(`예약 체결 — ${o.k} ${qs(o.q)}주 ${o.dir>0?"매수":"매도"}`,"var(--warn)");
    else
      toast(`예약 불발 — ${o.k} ${qs(o.q)}주 ${o.dir>0?"매수":"매도"} (${o.dir>0?"현금 부족":"수량·한도 초과"})`,"var(--up)");});
  marginCall();

  pend.forEach(p=>{const L=S.aLog[p.id]; if(!L)return; L.t++;
    if(Math.sign(S.price[p.k]-snap[p.k])===p.dir)L.h++});
  settleTips(snap);
  /* 업적 판정 — 반드시 rollDay(가격 갱신) 뒤에서. 앞에 두면 변화량이 항상 0이 된다 */
  if(Object.keys(S.tracked).length)unlock("track");
  if(Object.keys(S.known).length)unlock("paper");
  if(S.didShort&&netWorth()>S.nwPrev)unlock("short");
  if(netWorth()>=50000)unlock("x100");
  const mimicDay=S.today.fired.find(f=>f.mimic);
  if(mimicDay&&!S.hold[mimicDay.mimicOf])unlock("dodge");
  for(const k in (S.invBet||{}))
    if(Math.sign(S.price[k]-snap[k])===-S.invBet[k])unlock("invert");
  S.invBet={};
  /* ── 손익이 마음에 남는다 ──
     크게 잃은 밤은 잠이 안 오고, 번 날은 조금 풀린다.
     잃는 쪽이 버는 쪽보다 세다 — 실제로도 그렇다. */
  const nw1=netWorth(), r=(nw1-S.nwPrev)/Math.max(1,Math.abs(S.nwPrev));
  S.maxSwing=Math.max(S.maxSwing||0,Math.abs(r*100));

  if(r<=-0.03){
    const up=Math.min(18,Math.round((-r*100-3)*0.8));

  }else if(r>=0.03){
    const dn=Math.min(6,Math.round((r*100-3)*0.35));
    if(dn>0){S.stress=Math.max(0,S.stress-dn);
      toast(`${(r*100).toFixed(1)}% 벌었다. 어깨가 조금 내려간다. 스트레스 −${dn}`,"var(--dn)");}
  }
  checkEnd(); render();
  if(!S.over){autoSave(); morning();}
}
function checkEnd(){

     대신 빈손으로 실려 가면 그 자리에서 끝난다(hurt 참조). */
  if(S.day<=S.sickUntil){ if(S.over)showEnd(); return }
  if(S.stress>=150){S.over={t:"번아웃"}}
  else if(nw<=0){S.zeroDays++;if(S.zeroDays>=7)S.over={t:"고사"}}
  else S.zeroDays=0;
  if(!S.over&&S.day>DAYS){
    unlock("finish");
    const r=nw>=121600?"S":nw>=12160?"A":nw>=5000?"B":nw>=START_CASH?"C":"F";
    S.over={t:DAYS+"일 종료",rank:r};}
  if(S.over)showEnd();
}

function rollBazaar(){
  if(S.bzr&&S.bzr.day===S.day)return;
  dayRNG("bzr"+S.day);
  /* 값은 순자산에 붙는다 — 부자가 되어도 정보가 공짜가 되지는 않는다.

  const base=Math.max(2,Math.round(netWorth()*0.011));
  const who=shuf(DEALERS.slice()).slice(0,ri(2,3));
  const pool=STOCKS.slice().sort((a,b)=>tomorrowMag(b.k)-tomorrowMag(a.k)).slice(0,7);
  const used=new Set();
  S.bzr={day:S.day,items:who.map(d=>{
    let x=pick(pool); for(let i=0;i<6&&used.has(x.k);i++)x=pick(pool); used.add(x.k);
    const scam=RNG()<d.sc, real=tomorrowDir(x.k);
    return {d:d.id,k:x.k,n:x.n,say:pick(d.say),bought:false,hag:0,
      dir:scam?-real:(RNG()<d.ac?real:-real),
      price:Math.max(2,Math.round(base*d.mul))};})};
}

function settleTips(snap){
  if(!S.tips||!S.tips.length)return;
  S.dlrLog=S.dlrLog||{};
  S.tips=S.tips.filter(t=>{
    const L=S.dlrLog[t.d]=S.dlrLog[t.d]||{b:0,h:0};
    L.b++; if(Math.sign(S.price[t.k]-snap[t.k])===t.dir)L.h++;
    return false;});
}
function dlrWord(id){
  const L=(S.dlrLog||{})[id]; if(!L||L.b<2)return "";
  const r=L.h/L.b;
  return r>=.8?`여태 ${L.b}번 중 ${L.h}번 맞았다`:r>=.5?`${L.b}번 중 ${L.h}번`:`${L.b}번 사서 ${L.h}번 맞았다`;
}

/* 표를 그린 다음 — 굴러가는 칸이 있으면 한 프레임씩 숫자를 갱신한다. 루프는 하나만 돈다 */
function runRolls(){
  if(ui.rollLoop||!((ui.roll&&Object.keys(ui.roll).length)||ui.nwRoll)||!window.requestAnimationFrame)return;
  ui.rollLoop=true;
  const step=()=>{
    const now=animNow(); let live=0;
    document.querySelectorAll(".pxcell[data-k]").forEach(td=>{
      const k=td.dataset.k, a=ui.roll[k]; if(!a)return;
      const v=rollVal(a,now), done=rollDone(a,now);
      const pv=td.querySelector(".pv"); if(pv)pv.textContent=fmtP(v);
      const pc=td.parentElement&&td.parentElement.querySelector(".pccell");
      if(pc&&!halted(k)&&S.prev[k]){const c=(v/S.prev[k]-1)*100;
        pc.textContent=arw(c)+" "+Math.abs(c).toFixed(2)+"%"; pc.className="mono pccell "+cls(c);}
      if(done){delete ui.roll[k]; td.classList.remove("rup","rdn")}
      else live++;});
    if(ui.nwRoll){const a=ui.nwRoll, el=document.querySelector(".nwroll");
      if(el)el.textContent=fmt(rollVal(a,now));
      if(rollDone(a,now))ui.nwRoll=null; else live++;}
    if(ui.chartLive){drawChart(); if(!ui.roll[ui.sel])ui.chartLive=false; else live++;}
    if(live&&ui.tab==="mkt")requestAnimationFrame(step); else ui.rollLoop=false;};
  requestAnimationFrame(step);
}
/* 상장 꼬리표 — 관리종목·정리·신규. 사고팔 수 있는지와 며칠 남았는지는 숨길 일이 아니다 */
function listTag(k){
  const L=S.lst&&S.lst[k], m=mgOf(k), r=S.retire&&S.retire[k];
  if(r)return `<span class="lmark up">정리 ${Math.max(0,r.at-S.day)}</span>`;
  if(m&&m.left!==undefined)return `<span class="lmark warn">관리 ${m.left}</span>`;
  if(L&&L.kind!=="orig"){const age=S.day-L.d, lim=SM[k].g==="hero"?14:3;
    if(age<lim)return `<span class="lmark new">${L.kind==="re"?"재상장":L.kind==="debut"?"신인":"신규"}</span>`;}
  return "";
}
/* 주식 표에는 정지만 띄운다 — 사고팔 수 없다는 건 숨길 일이 아니다.
   부상·조사·계열 인원은 협회 포털과 지면에서 읽어야 한다. 그게 정보의 값이다 */

function vMkt(){
  const nw=netWorth(), pnl=(nw/START_CASH-1)*100, np=S.nurukPick;
  const tips={};
  /* 공시는 더 이상 방향을 말하지 않는다 — 표식은 루머·현장·장터만 남는다 */
  /* 같은 종목에 글이 여러 개 붙으면 그게 신호다 — 방향이 갈리면 더더욱 */
  if(S.readRumor){
    const cnt={};
    visibleRumors().filter(r=>r.kind==="stock").forEach(r=>{
      const c=cnt[r.k]=cnt[r.k]||{up:0,dn:0}; r.dir>0?c.up++:c.dn++;});
    Object.entries(cnt).forEach(([k,c])=>{
      const n=c.up+c.dn;
      tips[k]={rum:1,n,split:c.up>0&&c.dn>0,dir:c.up>c.dn?1:c.up<c.dn?-1:0};});
  }
  /* 장터에서 산 방향 — 현장 캐묻기는 이제 종목을 말하지 않으니, 표에 붙는 건 산 것뿐이다 */
  if(S.tip&&S.tip.day===S.day)tips[S.tip.k]={dir:S.tip.dir,field:1};
  /* 틱 연출 — 마지막으로 본 값과 다르면 그 값에서 새 값까지 굴린다.
     다른 탭에 있다가 돌아와도, 그사이 무엇이 얼마나 움직였는지가 눈앞에서 다시 움직인다 */
  const now=animNow();
  ui.seenPx=ui.seenPx||{}; ui.roll=ui.roll||{}; ui.seenLen=ui.seenLen||{}; ui.lastDir=ui.lastDir||{};
  for(const k in ui.roll)if(rollDone(ui.roll[k],now))delete ui.roll[k];
  STOCKS.forEach(s=>{const was=ui.seenPx[s.k], cur=S.price[s.k], len=S.hist[s.k].length, seenLen=ui.seenLen[s.k];
    if(was!==undefined&&Math.abs(cur-was)>1e-9){
      const a0=ui.roll[s.k], shownNow=a0&&!reduceMotion()?rollVal(a0,now):was;
      ui.lastDir[s.k]=cur>shownNow?1:-1;                     // 다 굴러간 뒤에도 방금 본 그 방향의 색으로 남는다
      if(!reduceMotion()){
        const a=a0, from=shownNow;                         // 굴러가는 중이었으면 지금 보이는 값에서 이어서
        /* 그사이 밤을 건넜으면(새 점 중에 시가가 있으면) 밤이 그려지는 만큼 길게 굴린다 */
        const fromIdx=seenLen!==undefined&&seenLen<len?seenLen:len-1;
        let night=false; for(let j=fromIdx;j<len;j++)if(j>0&&j%4===0)night=true;
        ui.roll[s.k]={from,to:cur,t0:now,dir:cur>from?1:-1,dur:night?NIGHT_MS:ROLL_MS,fromIdx};}}
    ui.seenPx[s.k]=cur; ui.seenLen[s.k]=len;});
  /* 총자산도 마지막으로 본 값에서 굴러간다 */
  if(ui.nwRoll&&rollDone(ui.nwRoll,now))ui.nwRoll=null;
  {const nw0=netWorth();
   if(ui.seenNw!==undefined&&Math.abs(nw0-ui.seenNw)>0.005&&!reduceMotion())
     ui.nwRoll={from:ui.nwRoll?rollVal(ui.nwRoll,now):ui.seenNw,to:nw0,t0:now};
   ui.seenNw=nw0;}
  /* 지금 화면에 보여야 할 값 — 굴러가는 중이면 중간값 */
  const shown=k=>ui.roll[k]?rollVal(ui.roll[k],now):S.price[k];
  /* 마지막으로 움직인 방향의 색이 남는다 — 아직 움직인 걸 못 봤으면 전일 대비로 */
  const tickCls=k=>{if(halted(k))return ""; const d=ui.lastDir[k]!==undefined?ui.lastDir[k]:Math.sign(chg(k));
    return d>0?" pup":d<0?" pdn":""};
  const rollCls=k=>{const a=ui.roll[k]; if(!a)return tickCls(k);
    return `${tickCls(k)} ${a.dir>0?"rup":"rdn"}" style="animation-delay:-${Math.round(now-a.t0)}ms;animation-duration:${a.dur||ROLL_MS}ms`};
  const pvStyle=k=>{const a=ui.roll[k]; return a?` style="animation-delay:-${Math.round(now-a.t0)}ms;animation-duration:${a.dur||ROLL_MS}ms"`:""};
  const rows=g=>STOCKS.filter(s=>s.g===g).map(s=>{

      <td class="l cut" style="color:var(--tx3);font-size:11.5px">${st||s.s}</td>
      <td class="mono pxcell${rollCls(s.k)}" data-k="${s.k}"><span class="pv"${pvStyle(s.k)}>${fmtP(shown(s.k))}</span></td>
      ${(()=>{const sc=halted(s.k)?0:(S.prev[s.k]?(shown(s.k)/S.prev[s.k]-1)*100:0);
        return `<td class="mono pccell ${halted(s.k)?"":cls(sc)}" data-k="${s.k}">${halted(s.k)?"— 정지":arw(sc)+" "+Math.abs(sc).toFixed(2)+"%"}</td>`})()}
      <td class="mono" style="color:var(--tx3)">${(sigOf(s.k)*100).toFixed(1)}%</td>
      <td class="mono" style="color:var(--tx3)">${h?fmt(h*S.price[s.k]):"—"}</td></tr>`}).join("");
  return `<div class="mkthead"><h2 class="ph">뉴네오시티 증권거래소</h2>
    <span class="idx mono">총자산 <b class="${cls(pnl)} nwroll">${fmt(ui.nwRoll?rollVal(ui.nwRoll,now):nw)}</b> Mk · ${pnl>=0?"+":""}${pnl.toFixed(1)}% · 목표 ${fmt(S.goal,0)}</span>

    ${shortValue()>0?`<span class="idx mono dn">공매도 ${fmt(shortValue())} Mk · 유지비율 ${(netWorth()/shortValue()*100).toFixed(0)}% (30% 미만 시 반대매매)</span>`:""}
    <button class="padbtn${bookIsOpen()&&!BW.fold&&ui.bookTab==="diary"?" on":""}" onclick="openDiary()">✎ 내 글</button></div>
    ${np?`<div class="item" style="--tc:var(--nuruk);border-left:2px solid var(--nuruk);margin-bottom:14px">
      <div class="meta"><span class="src">누룩</span></div>
      <div class="hl">${NURUK_SAY[np.mood][np.si].replace("{k}",
        `<b class="tk" style="color:var(--nuruk)">${np.k}</b>`)}

      :`<div class="hint" style="margin-bottom:14px">누룩이 축 늘어져 있다. 밥을 주자.</div>`}

const estHtml=(q,px,gross,sl)=>`단가 <b>${fmtP(px)}</b> × ${qs(q)}주 = <b>${fmt(gross)}</b><br>

/* 종목 고르기 — 속성 문자열 안에서 렌더 때의 변수를 참조하면 클릭 시점에 터진다.

/* ── 차트 ── 토스처럼: 굵은 선 하나, 기간의 방향으로 색, 최고·최저만 짚는다.
   격자도, 면 채우기도, 밤 표시도 없다. 밤의 요동은 아침 정산 화면에서만 본다.
   마지막으로 본 뒤에 생긴 점은 표의 숫자가 굴러가는 동안 이어 그려진다 */
const CH_RANGES=[["1d","1일"],["1w","1주"],["1m","1달"],["all","전체"]];
function chartRange(k){
  const all=S.hist[k]||[], n=all.length, lastDay=Math.floor(Math.max(0,n-1)/4), r=ui.chartRange||"1m";
  const from=r==="1d"?Math.max(0,lastDay*4-1)              // 어제 종가부터 오늘까지
           :r==="1w"?Math.max(0,(lastDay-6)*4)
           :r==="1m"?Math.max(0,(lastDay-29)*4):0;
  return {from,pts:all.slice(from)};
}
/* 가로 좌표와 아래 눈금 — 1일은 시간 눈금이 고정이다(어제 · 아침 · 점심 · 오후 · 마감),
   선은 지금 시각까지만 간다. 다른 기간은 점을 고르게 펴고 아래에 날짜를 단다.
   오른쪽 46px은 가격 눈금 자리 */
const CH_L=8, CH_R=46, CH_SLOTS=["어제","아침","점심","오후","마감"];
const CH_UP="#FF5B4A", CH_DN="#4A9BFF";
function chartGeo(k,W){
  const {from,pts}=chartRange(k), n=pts.length-1, L=CH_L, R=CH_R, len=(S.hist[k]||[]).length;
  const R1D=(ui.chartRange||"1m")==="1d", slot0=R1D&&from===0?1:0;      // 오늘 상장했으면 어제가 없다
  const X=R1D?(i=>L+((i+slot0)/4)*(W-L-R)):(i=>L+(n?i/n:0.5)*(W-L-R));
  const ticks=[];
  if(R1D)CH_SLOTS.forEach((t,s)=>{if(s>=slot0)ticks.push({t,x:L+(s/4)*(W-L-R),cur:s===slot0+n})});
  else{
    /* 날짜 — hist 한 칸이 하루 네 점이니 첫 점의 날을 거꾸로 셀 수 있다 */
    const day0=S.day-Math.floor((len-1)/4);
    const dOf=j=>day0+Math.floor(j/4), lastD=dOf(from+n);
    const pxDay=n?4/n*(W-L-R):W, step=Math.max(1,Math.ceil(64/pxDay));
    for(let j=from;j<=from+n;j++){if(j%4!==0)continue; const d=dOf(j);
      if((lastD-d)%step!==0)continue;
      const dt=new Date(2045,11,12+d);
      ticks.push({t:`${dt.getMonth()+1}.${String(dt.getDate()).padStart(2,"0")}`,x:X(j-from),cur:d===lastD,d});}}
  return {from,pts,n,R1D,slot0,X,ticks,len};
}
/* 오르내림 구간 — 작은 흔들림으로는 색을 안 바꾼다.
   직전 꼭짓점에서 th 넘게 되돌아서야 「꺾였다」고 보고, 색은 그 꼭짓점에서 바뀐다(지그재그).
   그래서 옆으로 기다가 오르는 구간은 통째로 빨강, 옆으로 기다가 내리는 구간은 통째로 파랑이 된다 */
function chartLegs(p,th){
  const n=p.length-1; if(n<1)return [{a:0,b:Math.max(0,n),up:true}];
  let dir=0, ext=0; const piv=[0], dirs=[];
  for(let i=1;i<=n;i++){
    if(dir===0){ if(p[i]-p[0]>=th){dir=1;ext=i} else if(p[0]-p[i]>=th){dir=-1;ext=i} }
    else if(dir>0){ if(p[i]>=p[ext])ext=i; else if(p[ext]-p[i]>=th){piv.push(ext);dirs.push(1);dir=-1;ext=i} }
    else{ if(p[i]<=p[ext])ext=i; else if(p[i]-p[ext]>=th){piv.push(ext);dirs.push(-1);dir=1;ext=i} }
  }
  dirs.push(dir===0?(p[n]>=p[0]?1:-1):dir); piv.push(n);
  return dirs.map((d,i)=>({a:piv[i],b:piv[i+1],up:d>0}));
}
/* 꺾였다고 볼 폭 — 보이는 폭의 15%. 거의 평평할 때는 값의 1.2% — 그 아래 흔들림으로는 색이 안 바뀐다 */
const chartTh=p=>Math.max((Math.max(...p)-Math.min(...p))*0.15,Math.abs(p[p.length-1])*0.012);
/* 오른쪽 가격 눈금 — 1·2·2.5·5 단위로 딱 떨어지는 값. 셋에서 다섯 개가 나오는 가장 큰 간격을 고른다 */
function chartTicksY(lo,hi){
  const span=(hi-lo)||Math.abs(hi)*0.02||1, e=Math.pow(10,Math.floor(Math.log10(span)));
  const cands=[];[e*10,e*5,e*2.5,e*2,e,e/2,e/4,e/5,e/10,e/20].forEach(x=>cands.push(x));
  const cnt=st=>Math.floor(hi/st+1e-9)-Math.ceil(lo/st-1e-9)+1;
  const st=cands.find(x=>cnt(x)>=3)||cands[cands.length-1];
  const dec=Math.max(0,Math.min(4,[0,1,2,3,4].find(d=>Math.abs(st*Math.pow(10,d)-Math.round(st*Math.pow(10,d)))<1e-6)));
  const out=[]; for(let v=Math.ceil(lo/st-1e-9)*st; v<=hi+1e-9&&out.length<7; v+=st)out.push({v,t:fmt(+v.toFixed(6),dec)});
  return out;
}
/* 짚은 점의 시각 — 1일은 「어제 마감 · 아침 · 점심 · 오후 · 마감」, 나머지는 「12.18 오후」 */
function chartWhen(j,G){
  if(G.R1D){const s=(j-G.from)+G.slot0; return s===0?"어제 마감":CH_SLOTS[s]}
  const d=S.day-Math.floor((G.len-1)/4)+Math.floor(j/4), dt=new Date(2045,11,12+d);
  return `${dt.getMonth()+1}.${String(dt.getDate()).padStart(2,"0")} ${["아침","점심","오후","마감"][j%4]}`;
}
/* 마우스·손가락으로 짚기 — 가장 가까운 점을 고른다. 손가락은 떼고 조금 뒤에 사라진다 */
function chartPoint(e){
  const c=$("chart"), G=ui.chartG; if(!c||!G||!e)return;
  const r=c.getBoundingClientRect(), x=e.clientX-r.left;
  let best=0, bd=1e9; for(let i=0;i<=G.n;i++){const d=Math.abs(G.X(i)-x); if(d<bd){bd=d;best=i}}
  clearTimeout(ui.chartOutT); if(ui.chartHi!==best){ui.chartHi=best; drawChart()}
}
function chartOut(later){clearTimeout(ui.chartOutT);
  if(later){ui.chartOutT=setTimeout(()=>chartOut(),1600);return}
  if(ui.chartHi!==null&&ui.chartHi!==undefined){ui.chartHi=null; drawChart()}}
function drawChart(){
  const c=$("chart"); if(!c)return;

  const at=x=>{const i=Math.floor(x), f=x-i; return i>=n?pts[n]:pts[i]+(pts[i+1]-pts[i])*f};
  /* 눈금 — 보이는 값과, 들고 있으면 평균 단가까지(너무 멀면 빼고) */
  let lo=Math.min(...pts), hi=Math.max(...pts);
  const h=S.hold[k]||0, cost=(S.cost||{})[k], sp0=(hi-lo)||Math.abs(hi)*0.02||1;
  const showAvg=Math.abs(h)>=QSTEP&&cost>0&&cost>=lo-sp0*0.6&&cost<=hi+sp0*0.6;
  if(showAvg){lo=Math.min(lo,cost); hi=Math.max(hi,cost)}

  const T=22,B=36,L=CH_L,R=CH_R;
  const G=chartGeo(k,W), {R1D,X}=G;
  ui.chartG={n,X,from,R1D:G.R1D,slot0:G.slot0,len:G.len};
  const Y=v=>T+(1-(v-lo)/span)*(H-T-B);
  /* 구간마다 색 — 꺾인 데서만 바뀐다 */
  const legs=chartLegs(pts,chartTh(pts));
  const colAt=i=>{const L2=legs.find(l=>i>=l.a&&i<=l.b)||legs[legs.length-1]; return L2.up?CH_UP:CH_DN};
  const font="11px 'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif";
  /* 오른쪽 가격 눈금과 아주 옅은 가로줄 */
  g.font="10.5px 'IBM Plex Mono',monospace"; g.textAlign="right"; g.textBaseline="middle";
  chartTicksY(lo,hi).forEach(({v,t})=>{const y=Y(v); if(y<T-4||y>H-B+4)return;
    g.strokeStyle="rgba(200,212,234,.07)"; g.lineWidth=1; g.beginPath(); g.moveTo(L,y); g.lineTo(W-R+4,y); g.stroke();
    g.fillStyle="#6B7A9B"; g.fillText(t,W-2,y)});
  /* 아래 눈금 */
  g.font="10.5px 'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"; g.textBaseline="bottom";
  G.ticks.forEach(({t,x,cur})=>{g.fillStyle=cur?"#C8D4EA":"#6B7A9B";
    g.textAlign=x<L+14?"left":x>W-R-14?"right":"center"; g.fillText(t,x<L+14?L:x>W-R-14?W-R:x,H-3)});

    g.fillStyle="rgba(11,16,32,.92)"; g.strokeStyle="rgba(200,212,234,.28)"; g.lineWidth=1;

  if(showAvg){const y=Y(cost);

  if(n===0){g.fillStyle=colAt(0); g.beginPath(); g.arc(X(0),Y(pts[0]),3,0,7); g.fill(); avgPill(); return}

  avgPill();
  /* 최고 · 최저 — 지금까지 그려진 데서 */

    g.font=font; const tw=(g.measureText?g.measureText(tx).width:70)||70;

    g.fillText(tx,g.textAlign==="left"?4:g.textAlign==="right"?W-R:x,above?y-6:y+6);};
  /* 점이 넷 이상일 때만, 그리고 다 그려진 뒤에 — 두 점짜리 선의 양 끝에 최고·최저를 붙이면 우습다 */
  if(!live&&n>=3&&shown[iMax]>shown[iMin]){tag(iMax,"최고",true); tag(iMin,"최저",false);}
