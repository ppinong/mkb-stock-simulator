  if(live||(ui.chartRange||"1m")==="1d"){const x=X(head), y=Y(at(head));
    g.fillStyle=colAt(Math.min(Math.floor(head),n)); g.beginPath(); g.arc(x,y,3.2,0,7); g.fill();
    if(live){g.globalAlpha=.22; g.beginPath(); g.arc(x,y,8,0,7); g.fill(); g.globalAlpha=1}}
  /* 짚은 점 — 세로 점선, 점, 그리고 값과 시각 */
  const hi2=ui.chartHi;
  if(!live&&hi2!==null&&hi2!==undefined&&hi2<=n){
    const x=X(hi2), y=Y(pts[hi2]), cc=colAt(hi2);
    if(g.setLineDash)g.setLineDash([3,3]); g.strokeStyle="rgba(200,212,234,.38)"; g.lineWidth=1;
    g.beginPath(); g.moveTo(x,T-8); g.lineTo(x,H-B+4); g.stroke(); if(g.setLineDash)g.setLineDash([]);
    g.fillStyle=cc; g.beginPath(); g.arc(x,y,4.2,0,7); g.fill();
    g.strokeStyle="#0B1020"; g.lineWidth=1.6; g.stroke();

    g.font="600 12.5px 'IBM Plex Mono',monospace"; const w1=(g.measureText?g.measureText(t1).width:80)||80;
    g.font="11px 'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"; const w2=(g.measureText?g.measureText(t2).width:110)||110;
    const bw=Math.max(w1,w2)+18, bh=38;

    g.fillStyle="rgba(11,16,32,.95)"; g.strokeStyle="rgba(200,212,234,.25)"; g.lineWidth=1;
    g.beginPath(); if(g.roundRect)g.roundRect(bx,by,bw,bh,6); else g.rect(bx,by,bw,bh); g.fill(); g.stroke();

    g.font="600 12.5px 'IBM Plex Mono',monospace"; g.fillStyle=cc; g.fillText(t1,bx+9,by+16);

  }
}
/* 진행 중인 정황 — 이름은 모르고 흔적만 안다 */

  ids.sort((a,b)=>(S.tracked[b].open?1:0)-(S.tracked[a].open?1:0)||(S.tracked[b].last||0)-(S.tracked[a].last||0));
  const body=ids.length?`<div class="nb">${ids.map(i=>{const t=S.tracked[i], n=(t.notes||[]).slice(-4).reverse();
    const who=S.known[i]?VM[i].n:`흔적 ${S.archive[i]||0}/3`;
    return `<div class="nbk${t.open?"":" cold"}"><div class="nb-h"><b>${opName(i)}</b>
      <span>${t.open?`진행 중 · ${opAge(i)||"?"}일째`:"지나감"} · ${who}</span></div>
      ${n.length?n.map(x=>`<div class="nb-r"><span>D+${x.d} ${x.w} · ${NOTE_K[x.k]||"본 것"}</span>${x.t}</div>`).join("")
        :`<div class="nb-r"><span></span>${t.sig.length?t.sig[t.sig.length-1]:"현장에서 직접 봤다."}</div>`}</div>`}).join("")}</div>`
    :`<p class="pd">아직 적은 게 없다.</p>`;
  return `<div class="lifesep"><span>현장 기록</span></div>${body}`;
}

/* ── 미니게임: 누룩 두드리기 ── */
let mg={on:false,n:0,t:0,timer:null};
function mgStart(){
  if(!left()||mg.on||netBusy())return;
  mg={on:true,n:0,t:6.0,timer:null};
  mg.timer=setInterval(()=>{
    mg.t-=0.1;
    if(mg.t<=0){clearInterval(mg.timer);mgEnd()}
    else{const b=document.getElementById("mgbar");if(b)b.style.width=(mg.t/6*100)+"%";
      const c=document.getElementById("mgn");if(c)c.textContent=mg.n}},100);
  renderView();
}
const MG_FACE=["f_smile","f_hype","f_idle","f_hype","f_smile","f_melt"];
function mgTap(){
  if(!mg.on)return;
  mg.n++;
  const c=$("mgn"); if(c)c.textContent=mg.n;
  /* 두드릴수록 표정이 바뀌고, 마지막엔 흘러내린다 */
  const im=$("mgimg");
  if(im){ im.src=IMG[MG_FACE[Math.min(Math.floor(mg.n/6),MG_FACE.length-1)]];
    const b=im.parentElement; b.classList.add("hit");
    setTimeout(()=>b.classList.remove("hit"),70); }
}
function mgEnd(){
  mg.on=false;
  const n=mg.n, base=Math.min(28,10+Math.floor(n/4));
  const drop=Math.max(1,Math.round(base*[1,.6,.35,.2,.12,.08][Math.min(S.rested||0,5)]))+(has("phone")?3:0);
  S.rested=(S.rested||0)+1;
  S.stress=Math.max(0,S.stress-drop);
  S.mood=Math.min(100,S.mood+(n>=60?10:n>=35?6:3));
  S.ach.tap=Math.max(S.ach.tap||0,n);
  toast(`${n}번 두드렸다. 스트레스 −${drop}`,"var(--play)");
  spend(1);
}
/* 돈 벌기와 쉬기는 같은 하루를 놓고 다투는 선택이라 한 창에 둔다 */
const LIFE_V=[["main","생활"],["buy","구매"],["used","중고장터"]];
function vLife(){
  if(mg.on)return vPlay();
  const v=ui.lifeView||"main";
  if(v==="used"&&S.used&&S.used.unread){S.used.unread=0; renderTabs()}
  const nav=`<div class="lifenav">${LIFE_V.map(([k,t])=>
    `<button class="${v===k?"on":""}" onclick="ui.lifeView='${k}';renderView()">${t}${
      k==="used"&&S.used&&S.used.unread?`<span class="nb2">${S.used.unread}</span>`:""}</button>`).join("")}</div>`;
  if(v==="buy")return nav+`<h2 class="ph">구매 · 살림</h2>`+vBuy();
  if(v==="used")return nav+`<h2 class="ph">중고장터</h2>`+vUsed();
  return nav+vWork()
    +`<div class="lifesep"><span>은행</span></div>`+vBank()
    +`<div class="lifesep"><span>쉬기</span></div>`+vPlay()
    +`<div class="lifesep"><span>누룩과 놀기</span></div>`+vPet();
}

        :`창구는 <b>D+${BANK_DAY}</b> 이후, 고료 명세 <b>${BANK_WEEKS}주치</b>가 있어야 열린다 — 지금 <b>${S.paidWeeks||0}주치</b>`}</div></div>`;

        <b class="mono">원리금 ${fmt(L.bal)} Mk</b><span class="bk-f">${age>=LOAN_DUN?"<b style='color:var(--up)'>독촉</b> · ":""}강제 집행까지 ${LOAN_SEIZE-age}일</span></div>`
    :B.debt>0?`<div class="bk-line bk-hot"><span>빚 · 하루 ${(DEBT_RATE*100).toFixed(1)}%씩 붙는다</span><b class="mono">${fmt(B.debt)} Mk</b><span class="bk-f">갚기 전에는 못 빌린다</span></div>`
    :S.day<B.cool?`<div class="bk-line"><span>대출 냉각</span><b class="mono">${B.cool-S.day}일</b><span class="bk-f">다 갚은 날부터 ${LOAN_COOL}일은 못 빌린다</span></div>`
    :`<div class="bk-line"><span>단기 대출</span><span class="bk-f">0.4% → 6일째 0.8% → 10일 독촉 → 1.6% → 15일 강제 집행</span></div>`;
  const depRow=`<div class="bk-line"><span>예금 · 하루 ${(DEP_RATE*100).toFixed(2)}%</span><b class="mono">${fmt(B.dep)} Mk</b>
      <span class="bk-f">${B.dep>0&&S.day-B.depDay<3?"사흘 안에 깨면 신용 −8":B.dep>=0.2*Math.max(1,nw)?"순자산의 20% 이상 — 신용이 매일 오른다":"순자산의 20% 이상이면 신용이 매일 오른다"}</span></div>`;
  const owe=L?L.bal:B.debt;
  return head+loanRow+depRow+`
    <div class="bk-form">

        oninput="setBamt(this.value)" onfocus="this.select()"><span class="unit">Mk</span></div>
      <div class="pct">

        ${owe>0?`<button class="qbtn" onclick="ui.bamt=String(Math.ceil(Math.min(${owe},Math.max(0,S.cash))*100)/100);render()">갚을 만큼</button>`:""}
        <button class="qbtn" onclick="ui.bamt=String(Math.floor(Math.max(0,S.cash)*0.5));render()">현금 50%</button>
        ${B.dep>0?`<button class="qbtn" onclick="ui.bamt=String(Math.floor(S.bank.dep*100)/100);render()">예금 전액</button>`:""}</div>
      <div class="bk-btns">
        <button class="qbtn" ${canBorrow()?"":"disabled"} onclick="borrow(ui.bamt)&&(ui.bamt='')">빌리기</button>

/* 정규식을 템플릿 문자열 속 속성에 넣으면 \d가 그냥 d가 된다 — 함수로 뺀다 */

/* ── 구매 ── 생활 안의 따로 된 화면. 살림 스물둘 — 지금 살 수 있는 것, 들인 것, 집이 좁아 아직 못 들이는 것.

    <p class="pd buyhint">파는 가게에선 <b>정가</b> · 그 밖에선 <b>인터넷 주문</b>(+15%, 다음 날 아침) · 큰 물건은 큰 집에만</p>
    <div class="chips">${BUY_F.map(([k,t])=>`<button class="chip${f===k?" on":""}" onclick="ui.buyF='${k}';renderView()">${t}</button>`).join("")}</div>`;

  const tiers=[0,1,2,3,4].map(t=>{const L=GOODS.filter(x=>x.g===t&&show(x)); if(!L.length)return "";

function goodCard(x){
  const st=goodState(x.id), at=S.where===x.at&&S.day>S.sickUntil, lock=hg()<x.g;
  const shop=`${SHOPS[x.at].n}(${DM[x.at].n})`;
  let act;
  if(st)act=`<div class="gstate ${st}">${{on:"들였다",ship:"배송 중 · 내일 아침 도착",store:"창고 · 집이 좁아 효과가 멈췄다"}[st]}</div>`;
  else if(lock)act=`<div class="gstate lock">${HG_N[x.g]} 이상 집에 들어간다</div>`;
  else if(at)act=`<button class="gbuy pri" ${S.cash<x.p?"disabled":""} onclick="buyGood('${x.id}',false)">여기서 사기 · ${fmt(x.p)} Mk</button>`;
  else{const pr=goodPrice(x.id,true);
    act=`<button class="gbuy" ${S.cash<pr?"disabled":""} onclick="buyGood('${x.id}',true)">인터넷 주문 · ${fmt(pr)} Mk</button>
      <div class="gnote">${shop}에 가면 정가 ${fmt(x.p)} Mk</div>`;}
  return `<div class="card gcard ${st||(lock?"lock":"")}">
    <div class="ct"><span class="cn">${x.n}</span><span class="gp mono">${fmt(x.p)} Mk</span></div>
    <div class="gd">${x.d}</div>
    <div class="gm">신용 +${x.cr} · ${shop}</div>
    ${act}</div>`;
}

  const m=S.mood;

function modal(t,b,btns,locked){
  $("mtitle").textContent=t;$("mbody").innerHTML=b;$("mfoot").innerHTML="";
  (btns||[{t:"닫기",f:closeModal}]).forEach(x=>{const e=document.createElement("button");
    e.textContent=x.t;if(x.p)e.className="pri";e.onclick=x.f;$("mfoot").appendChild(e)});
  $("modal").classList.toggle("locked",!!locked);   // 엔딩은 닫을 수 없다
  $("modal").classList.add("on")}
function closeModal(force){
  const m=$("modal");
  if(!force&&m.classList.contains("locked"))return;   // 엔딩은 ✕로 못 닫는다
  m.classList.remove("locked","on");                  // 다시 시작할 때는 잠금까지 푼다
}

const swapTk=(j,map)=>{const ks=Object.keys(map); if(!ks.length)return j;
  return j.replace(new RegExp("(^|[^A-Za-z0-9_])("+ks.join("|")+")(?=[^A-Za-z0-9_]|$)","g"),(_,a,k)=>a+map[k])};
const swapTxt=(j,pairs)=>{pairs.forEach(([a,b])=>{j=j.split(a).join(b)}); return j};

function migrateSave(j,v){
  if(v<12)return swapTxt(swapTk(j,OLD_TK),OLD_NM);
  if(v===12){
    /* 첫판의 메리 자리는 아이스펀치가 받는다 — 같은 성격(인기형)이다. 아이스펀치가 이미 나와 있었으면 정산 */
    const m={PNL:"SPN",MRY:"ICE"};
    try{const d=JSON.parse(j); if(d.S&&d.S.everListed&&d.S.everListed.ICE)delete m.MRY}catch(e){}
    return swapTxt(swapTk(j,m),V12_NM)}
  return j;
}
function doLoad(key){

  if(d.v!==SAVE_V&&![8,9,10,11,12,13,14].includes(d.v)){toast(`이전 버전 저장이다 (v${d.v||"?"} ≠ v${SAVE_V}). 불러올 수 없다.`,"var(--up)");return}
  if(d.v<SAVE_V){try{d=JSON.parse(migrateSave(j,d.v))}catch(e){toast("저장 파일을 옮길 수 없다.","var(--up)");return}}
  if(TXT_FIX.some(([a])=>j.includes(a))){try{d=JSON.parse(swapTxt(JSON.stringify(d),TXT_FIX))}catch(e){}}
  const L=d.S;

  const gone=(L.listed||[]).filter(k=>!SM[k]);

    if(L.hold)delete L.hold[k]; ["hero","retire","mgmt"].forEach(f=>{if(L[f])delete L[f][k]})});
  if(Array.isArray(L.listed))L.listed=L.listed.filter(k=>SM[k]);

  if(gone.length)toast(`이름표에서 빠진 종목 ${gone.length}개는 마지막 값으로 정산했다.`,"var(--warn)");

  L.spent=L.spent||0; L.dug=L.dug||0; L.fameBoost=L.fameBoost||0; L.biked=+L.biked||0;
  if(!L.used)L.used=newUsed(); if(!L.goodsCr)L.goodsCr={};

  try{

    (L.rumors||[]).forEach(r=>{if(r.a)r.a=relink(r.a); (r.rep||[]).forEach(c=>{c.a=relink(c.a)})});
    L.ach=L.ach||{}; L.tracked=L.tracked||{}; L.known=L.known||{}; L.papers=L.papers||[];
    Object.values(L.tracked).forEach(t=>{t.sig=t.sig||[];t.log=t.log||[];t.recent=t.recent||[]});

/* 스카이라인 — 파일로 들고 다니지 않고 그 자리에서 그린다.
   층마다 건물과 창을 따로 들고, 뒤층부터 「건물 → 그 층의 창」 순서로 칠한다.
   예전엔 건물을 전부 칠한 뒤 창을 한꺼번에 얹어서 뒤 건물의 창이 앞 건물 위로 비쳤다 — 창이 들쭉날쭉해 보이던 까닭.
   창은 건물마다 가운데 맞춘 격자 위에만 놓고, 불은 층 단위로 몰아 켠다. 깜박임은 아주 조금만.
   매 프레임 전체를 다시 칠한다 — 창만 덧칠하면 알파가 쌓여서 금세 하얗게 탄다. */
function opSky(){
  const c=$("skyline"); if(!c)return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const W=c.width=(c.offsetWidth||0)*dpr, H=c.height=(c.offsetHeight||0)*dpr;
  if(!W||!H)return;
  const g=c.getContext("2d"); if(!g)return;
  const R=mulberry32(20451212);
  const LAYER=[
    {base:.60,fill:"#0F1729",lo:.34,hi:.62,win:null},
    {base:.76,fill:"#16203A",lo:.28,hi:.50,win:{cw:4,ch:6,sx:10,sy:14,a:.30}},
    {base:.90,fill:"#1E2A48",lo:.16,hi:.32,win:{cw:5,ch:7,sx:12,sy:17,a:.42}}];
  const layers=LAYER.map(L=>{const bld=[], win=[], Wn=L.win;
    let x=-40*dpr;
    while(x<W+40*dpr){
      /* 창이 있는 층은 건물 폭을 창 간격의 배수로 — 격자가 건물 안에 딱 맞는다 */
      const w=(Wn?Math.max(3,Math.round((34+R()*56)/Wn.sx))*Wn.sx:30+R()*62)*dpr;
      const h=H*(L.lo+R()*(L.hi-L.lo)), top=H*L.base-h;
      bld.push([x,top,w,H-top]);
      if(Wn){const sx=Wn.sx*dpr, sy=Wn.sy*dpr, cw=Wn.cw*dpr, chh=Wn.ch*dpr;
        const cols=Math.max(1,Math.floor((w-6*dpr)/sx)), x0=x+(w-(cols-1)*sx-cw)/2;
        const rows=Math.max(1,Math.floor((H*L.base-top-16*dpr)/sy));
        const lit=.22+R()*.38;                                   // 건물마다 불 켜진 정도
        for(let r=0;r<rows;r++){
          if(R()>.72)continue;                                   // 통째로 불이 꺼진 층
          for(let k=0;k<cols;k++)if(R()<lit)win.push([x0+k*sx,top+10*dpr+r*sy,cw,chh,R()]);}}
      x+=w+(Wn?(2+Math.floor(R()*4))*2*dpr:(3+R()*10)*dpr);
    }
    return {L,bld,win};});
  let t=0, raf=0;
  (function tick(){
    if(!op.on||!document.getElementById("skyline")){cancelAnimationFrame(raf);return}
    t+=0.014;
    const sky=g.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,"#070B16"); sky.addColorStop(.52,"#121A32"); sky.addColorStop(1,"#25315A");
    g.fillStyle=sky; g.fillRect(0,0,W,H);
    layers.forEach(({L,bld,win})=>{
      g.fillStyle=L.fill; bld.forEach(([x,y,w,h])=>g.fillRect(x,y,w,h));
      if(!L.win)return;
      win.forEach(([x,y,w,h,ph])=>{
        const f=.86+.14*Math.sin(t*(.3+ph*.4)+ph*31);
        g.fillStyle="rgba(244,214,158,"+(.12+L.win.a*f*(.6+ph*.4)).toFixed(3)+")";
        g.fillRect(x,y,w,h);});});
    const veil=g.createLinearGradient(0,H*.15,0,H);
    veil.addColorStop(0,"rgba(7,11,22,0)"); veil.addColorStop(1,"rgba(7,11,22,.72)");
    g.fillStyle=veil; g.fillRect(0,H*.15,W,H*.85);
    raf=requestAnimationFrame(tick);
  })();
}

/* 타이핑 — 문장 전체를 먼저 깔아 두고 글자를 하나씩 드러낸다.
   한 글자씩 덧붙이면 줄 끝에서 치다 만 단어가 다음 줄로 튀어 넘어간다 */
function opType(html){
  const el=$("vntxt"); if(!el)return;
  clearInterval(op.typing);
  el.innerHTML=html;
  const chars=[];
  const wrap=n=>[...n.childNodes].forEach(c=>{
    if(c.nodeType===3){const f=document.createDocumentFragment();
      [...c.textContent].forEach(ch=>{const sp=document.createElement("span"); sp.className="vc"; sp.textContent=ch;
        f.appendChild(sp); chars.push(sp)});
      c.replaceWith(f)}
    else if(c.nodeType===1)wrap(c)});
  wrap(el);
  let i=0;
  op.typing=setInterval(()=>{
    if(i>=chars.length){clearInterval(op.typing);op.typing=null;return}
    chars[i++].classList.add("on");
  },26);
}
function opNext(){
  if(op.typing){ clearInterval(op.typing); op.typing=null;

}

/* ══════ 8.8 장면 ══════
   오프닝과 같은 대화창에 선택지와 메모 카드를 얹는다 — 누룩 가출(하루를 통째로 쓴다)과 도망치기(새벽 일)가 쓴다.
   줄 = {t, w?, pic?, art?, card?, ch?:[{t,d,f}]}. ch가 있으면 고를 때까지 넘어가지 않고, f()가 이어질 줄들을 돌려준다.
   card는 한 번 깔면 다음 card가 올 때까지 남는다(null이면 치운다). 효과는 고르는 순간 반영한다 */
let scn={on:false,L:[],i:0,end:null,card:null,cls:"",tag:""};
function scnOpen(lines,o){
  o=o||{}; clearInterval(op.typing); op.typing=null;
  scn={on:true,L:lines.slice(),i:0,end:o.end||null,card:null,cls:o.cls||"",tag:o.tag||""};
  $("open").className="on"; scnShow();
}
function scnClose(){
  if(!scn.on)return; scn.on=false; clearInterval(op.typing); op.typing=null;
  if(!op.on){$("open").className=""; $("open").innerHTML=""}
}
const scnCard=c=>`<div class="vn-card${c.cls?" "+c.cls:""}"><div class="vm-h">${c.h}</div>${c.L.map(x=>`<div>${x}</div>`).join("")}</div>`;
function scnShow(){
  if(!scn.on)return;
  const L=scn.L[scn.i];
  if(!L){const f=scn.end; scnClose(); if(f)f(); return}
  if(L.card!==undefined)scn.card=L.card;
  const pic=L.pic&&IMG[L.pic]?`<img class="vn-pic" src="${IMG[L.pic]}" alt="">`:"";
  const wait=Math.min(2400,String(L.t).replace(/<[^>]+>/g,"").length*26);     // 글자가 다 찍힌 뒤에 선택지가 뜬다
  $("open").innerHTML=`<div class="vn vn-scn ${scn.cls}${L.ch?" vn-q":""}" onclick="scnNext()">
    ${scn.tag?`<div class="vn-tag">${scn.tag}</div>`:""}
    <div class="vn-stage"><div class="vn-row">${scn.card?scnCard(scn.card):""}${L.art||""}${pic}</div></div>
    <div class="vn-box">${L.w?`<div class="vn-who">${L.w}</div>`:""}<div class="vn-txt" id="vntxt"></div>
      ${L.ch?`<div class="vn-ch" style="--d:${wait}ms">${L.ch.map((c,i)=>
        `<button onclick="event.stopPropagation();scnPick(${i})"><b>${c.t}</b>${c.d?`<small>${c.d}</small>`:""}</button>`).join("")}</div>`
        :`<div class="vn-go">클릭해서 계속</div>`}
    </div></div>`;
  opType(L.t);
}
function scnNext(){
  const L=scn.L[scn.i]; if(!scn.on||!L)return;
  if(op.typing){clearInterval(op.typing); op.typing=null;
    const el=$("vntxt"); if(el)el.innerHTML=L.t;
    const c=document.querySelector("#open .vn-ch"); if(c)c.classList.add("now"); return}
  if(L.ch)return;                                  // 고를 때까지 기다린다
  scn.i++; scnShow();
}
function scnPick(i){

  clearInterval(op.typing); op.typing=null;

  scn.i++; scnShow();
}
/* 아침 순서 — 새벽 일(도망치기)이 먼저, 그다음 아침 화면, 그걸 닫으면 그날의 장면(누룩 가출) */
const nurukDue=()=>!!(S&&!S.over&&S.nurukOut&&!S.nurukOut.found&&S.day>S.sickUntil);
const escDue=()=>!!(S&&!S.over&&S.esc&&!S.esc.done&&S.esc.day===S.day&&S.day>S.sickUntil);
function morning(){
  if(!S||DEV.quiet)return;
  if(escDue()&&!scn.on&&!op.on)return escScene();
  gapScreen(); sceneKick();
}
function sceneKick(){
  if(!S||S.over||DEV.quiet||scn.on||op.on)return;
  if($("gap").classList.contains("on")||$("night").classList.contains("on"))return;
  if(escDue())return escScene();
  if(nurukDue())return runScene();
}

/* ── 누룩 가출 장면 ── */
const NR_SPOT={cbd:"거래소 앞 화단",port:"컨테이너 더미 사이",old:"시장 빵집 뒷문 앞",new:"쇼핑몰 분수대 옆",
 ind:"공장 담벼락 밑",univ:"도서관 계단 밑",hq:"분실물 창구",ruin:"무너진 상가 틈"};
const NR_MISS={cbd:"거래소 앞엔 출근하는 사람들뿐이었다.",port:"부두엔 크레인 소리만 났다.",
 old:"시장 골목을 두 바퀴 돌았다. 빵집 앞에도 없었다.",new:"신도심은 길이 넓어서 오히려 찾기가 어려웠다.",
 ind:"공장 경비는 「빵? 못 봤는데」 하고 고개를 저었다.",univ:"캠퍼스를 한 바퀴 돌았다. 학생들만 이쪽을 쳐다봤다.",
 hq:"협회 본부 분실물 창구엔 우산만 잔뜩 있었다.",ruin:"폐허엔 바람 소리뿐이었다. 깊이 들어가지는 못했다."};
/* 그날의 판 — 시드와 날짜로 정해서, 다시 불러와도 실마리가 같다 */
function nrPlan(){
  const N=S.nurukOut, r=mulberry32(hashStr(S.seed+"|nrun|"+(S.ranAway||S.day)));
  const mix=a=>{a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]} return a};
  const dec=mix(DISTRICTS.map(d=>d.id).filter(id=>id!==S.home&&id!==N.d&&!blockedAt(id))).slice(0,2);
  const opts=mix([N.d].concat(dec));
  return {opts,shop:r()<0.75||!dec[0]?N.d:dec[0],gall:r()<0.5||!dec[1]?N.d:dec[1],coins:6+Math.floor(r()*13)};
}
function nrRelic(){
  const seen=S.relicSeen||{}, rel=RELICS.filter(x=>!seen[x.id]);
  return rel.length?rel[Math.floor(mulberry32(hashStr(S.seed+"|nfind"))()*rel.length)]:null;
}
function nrKeep(rel){S.relicSeen=S.relicSeen||{}; S.relicSeen[rel.id]=S.day; (S.relics=S.relics||[]).push({id:rel.id,d:S.day})}
function runScene(){
  const N=S.nurukOut; if(!N||N.found)return;
  const P=nrPlan(), home=S.home, dn=id=>DM[id].n, spot=NR_SPOT[N.d]||"골목", place=`${dn(N.d)} ${spot}`;
  const memo=["아침에 없어졌다","현관문이 한 뼘 열려 있었다"], card=()=>({h:"누룩 찾기",L:memo.slice()});
  const R={coins:0,miss:0};
  const opt=(ids,st)=>ids.map(id=>({t:dn(id),d:smellDir(home,id),f:()=>go(id,st)}));
  const ask=()=>[{t:"어디로 가 볼까.",ch:opt(P.opts,2)}];
  /* 둘째 고르기에서 틀리면 해 질 녘으로, 셋째에서 틀리면 그대로 밤 */
  function go(id,st){
    if(id===N.d)return end(st===2?"found":"tired",id);
    R.miss++; memo.push(`${dn(id)} — 없었다`);
    const L=[{t:NR_MISS[id]||`${dn(id)}에도 없었다.`,card:card()}];
    if(st===2)return L.concat([{t:"해가 기울기 시작했다."},
      {t:"해가 진다. 어떻게 할까.",ch:opt(P.opts.filter(x=>x!==id),3)
        .concat([{t:"집에 가서 기다린다",d:"누룩도 집은 안다",f:()=>end("wait")}])}]);
    return L.concat([{t:"터덜터덜 집으로 돌아왔다."}],end("late"));
  }
  function end(res,at){
    N.found=true; N.res=res; N.at=at||null;
    const early=res==="found", tired=res==="tired";
    const rel=early?nrRelic():null; if(rel)nrKeep(rel);
    const dm=early?15:tired?8:-5, ds=early?-4:tired?3:R.miss>=2?6:2;
    S.mood=Math.max(0,Math.min(100,S.mood+dm)); S.stress=Math.max(0,S.stress+ds);
    const fed=S.cash>=FEED; if(fed){S.cash-=FEED; S.nurukFed=true}
    memoPush(early?`${dn(at)}에서 누룩을 찾았다`+(rel?` — 「${rel.n}」${josa(rel.n,["을","를"])} 물고 있었다`:"")
      :tired?`해 질 녘 ${dn(at)}에서 누룩을 찾았다`:"누룩이 밤늦게 혼자 돌아왔다","누룩",true);
    const box={h:early?"누룩을 찾았다":tired?"해 질 녘에 찾았다":"누룩이 혼자 돌아왔다",L:[
      ...(at?[`${dn(at)} · ${spot}`]:[]),
      `누룩 기분 ${dm>0?"+":"−"}${Math.abs(dm)}`,
      ...(rel?[`주운 것 「${rel.n}」`]:[]),
      ...(R.coins?[`동전 +${R.coins} Mk`]:[]),
      fed?`누룩 밥 −${FEED} Mk`:"밥 줄 돈이 없었다",
      `스트레스 ${ds>=0?"+":"−"}${Math.abs(ds)}`,
      "오늘 장은 못 봤다"]};
    const done={t:"그렇게 하루가 갔다.",card:box};
    if(early)return [
      {pic:"f_hype",t:`${place}에서 누룩을 찾았다.`,card:null},
      rel?{pic:"f_smile",t:`입에 뭘 물고 있다. 「${rel.n}」${josa(rel.n,["이다","다"])}. 어디서 주웠는지는 말해 주지 않는다.`}
         :{pic:"f_smile",t:"누룩은 신이 나서 발밑을 데굴데굴 굴러다녔다."},
      fed?{pic:"bowl",t:"집에 오자마자 밥부터 줬다."}:{pic:"f_idle",t:"집에 와서 밥그릇을 봤다. 줄 게 없다."},
      done];
    if(tired)return [
      {pic:"f_melt",t:`해가 다 지고 나서야 ${place}에서 누룩을 찾았다.`,card:null},
      {pic:"f_sleep",t:"지쳐서 납작해져 있었다. 품에 안고 걸어서 돌아왔다."},
      {pic:"f_sleep",t:fed?"밥을 주자 반쯤 먹다가 그대로 잠들었다.":"밥그릇은 비어 있었다. 누룩은 그대로 잠들었다."},
      done];
    return [
      ...(res==="wait"?[{t:"집에 돌아와 현관문을 열어 두고 기다렸다.",card:null}]:[]),
      {t:"자정이 다 돼서 문 긁는 소리가 났다.",card:null},
      {pic:"f_cry",t:"누룩이 혼자 돌아와 있었다. 온몸이 먼지투성이다."},
      fed?{pic:"bowl",t:"어디 갔었냐고 물어도 대답이 없다. 밥을 주니 허겁지겁 먹었다."}
         :{pic:"f_cry",t:"어디 갔었냐고 물어도 대답이 없다. 밥그릇은 비어 있었다."},
      done];
  }
  scnOpen([
    {t:"폰을 내려놓고 보니 누룩이 안 보인다."},
    {t:"이불 속에도, 상자 사이에도 없다. 밥그릇은 어젯밤 그대로다."},
    {t:"현관문이 한 뼘쯤 열려 있다. 문틈으로 빵 냄새가 희미하게 새어 나간다.",card:card()},
    {t:"오늘은 장도 원고도 접어야겠다. 누룩부터 찾자."},
    {t:"어디부터 찾아볼까.",ch:[
      {t:"골목으로 나가 냄새를 따라간다",d:"냄새가 남아 있을 때",f:()=>{const w=smellDir(home,N.d);
        memo.push(`빵 냄새 — ${w}이 짙다`);
        return [{t:"골목 끝까지 빵 냄새가 이어져 있었다. 큰길에 나오자 끊겼다."},
          {t:`바람이 불 때마다 ${w}에서 냄새가 조금 더 짙게 왔다.`,card:card()}].concat(ask())}},
      {t:"동네 가게에 물어본다",d:"아침부터 문을 연 데가 있다",f:()=>{
        memo.push(`편의점 사장 — ${dn(P.shop)} 가는 버스 쪽`);
        return [{t:"골목 입구 편의점 사장이 계산대에서 고개를 들었다."},
          {w:"편의점 사장",t:`빵? 아, 아까 하나 굴러가던데. ${dn(P.shop)} 가는 버스 정류장 쪽으로.`,card:card()}].concat(ask())}},
      {t:"갤러리에 목격담을 묻는다",d:"주식 갤러리지만 사람은 제일 많다",f:()=>{
        memo.push(`갤러리 — 「${dn(P.gall)}에서 봤다」는 댓글`);
        return [{t:"「빵 모양으로 생긴 거 굴러가는 거 보신 분」 하고 글을 올렸다."},
          {t:"댓글이 금방 달렸다.",card:{h:"히어로 주식 갤러리",cls:"gal",
            L:["<b>ㅇㅇ</b>주식갤에 이걸 왜 올림",`<b>ㅇㅇ</b>아까 ${dn(P.gall)}에서 빵 같은 거 굴러가는 거 봄`,"<b>ㅇㅇ</b>곰팡이를 키운다고?"]}},
          {t:"믿어도 될지는 모르겠다.",card:card()}].concat(ask())}},
      {t:"집 안부터 다시 뒤진다",d:"멀리 갔을 리 없다",f:()=>{R.coins=P.coins; S.cash+=P.coins;
        memo.push(`집 안 — 없었다. 동전 ${P.coins} Mk`);
        return [{t:"침대 밑, 싱크대 아래, 신발장 안까지 다 열어 봤다. 없다."},
          {t:`대신 침대 밑에서 동전이 한 줌 나왔다. 누룩이 물어다 모아 둔 모양이다. ${P.coins} Mk.`},
          {t:"그사이 문틈 냄새는 다 날아갔다.",card:card()}].concat(ask())}}]}],
    {tag:`D+${S.day} · 누룩 가출`,end:()=>{if(S&&!S.over){render(); enterNight()}}});
}

/* ── 도망치기 ── 큰 사건(탑 낙하 · 델타급 몰락자 · 도시 전체 작전 실패)이 집 구역을 덮친 새벽. 아침 화면보다 먼저 뜬다.
   지하철(빠르다 · 인파에 다칠 수 있다) · 걸어서 강 건너(느리다 · 누룩이 뭘 주워 오기도) · 집에서 버티기(현금을 지킨다 · 무너지면 다친다).
   몰락자 통제는 숨어 있어도 협회가 끌어낸다. 입원 중이었으면 장면 없이 집에 둔 현금만 잃는다 */
const ESC_FIN={stack:"건너편 건물 외벽이 한꺼번에 무너져 내렸다.",obs:"건너편 건물 외벽이 한꺼번에 무너져 내렸다.",
 noname:"골목 여기저기서 사람들이 쓰러진 채 깨어나지 않는다는 소리가 들렸다.",
 forge:"빛나는 검을 든 남자가 이 동네를 지나갔다는 말이 돌았다.",
 disp:"하늘 한쪽이 검게 일렁였다. 보이드 계측기 경보가 집집마다 울렸다."};
const escOpenAt=id=>!!DM[id]&&id!==S.home&&!blockedAt(id);
function escSubTo(){return ["hq","new","univ","cbd","port","old","ind","ruin"].find(escOpenAt)||S.home}
/* 걸어서 갈 곳 — 강 건너편에서 덜 위험하고 가까운 데 */
function escRiverTo(){
  const a=MAP_LAB[S.home]; if(!a)return escSubTo();
  const far=id=>Math.hypot(MAP_LAB[id][0]-a[0],MAP_LAB[id][1]-a[1]);
  const L=DISTRICTS.map(d=>d.id).filter(id=>escOpenAt(id)&&MAP_LAB[id]&&(MAP_LAB[id][1]<157)!==(a[1]<157));
  L.sort((x,y)=>riskOf(x)-riskOf(y)||far(x)-far(y));
  return L[0]||escSubTo();
}
const escTowerArt=()=>`<svg class="vn-art" viewBox="-30 -58 60 78" aria-hidden="true">${towerSvg(0,0)}</svg>`;
function escIntro(E){
  const hn=DM[E.dist].n;
  if(E.k==="tower")return [
    {t:"새벽 네 시. 땅이 한 번 크게 울렸다."},
    {t:"창문이 덜컹거리고, 선반에서 컵이 떨어져 깨졌다."},
    {t:"커튼을 젖히자 하늘이 붉었다. 몇 블록 앞에 처음 보는 탑이 비스듬히 꽂혀 있었다.",art:escTowerArt()},
    {t:"사이렌이 울리기 시작했다. 그치지 않는다.",art:escTowerArt()}];
  if(E.k==="kids")return [
    {t:"새벽 세 시. 폰이 찢어지는 소리를 냈다."},
    {t:"재난 문자였다.",card:{h:"재난 문자",cls:"sms",L:[`[뉴네오시티 히어로 협회] ${hn} 일대 델타급 몰락자 출현. 주민은 즉시 대피 바랍니다.`]}},
    {t:"창밖을 보니, 며칠 전 탑이 떨어진 자리 쪽에서 검은 것이 번지듯 퍼지고 있었다."},
    {t:"닿은 자리는 숯처럼 검게 부서졌다."}];
  const v=VM[E.m&&E.m.v]||{}, op=(v.hx&&v.hx.op)||"작전";
  return [
    {t:"밤새 사이렌이 울렸다."},
    {t:T("「{v}」의 도시 전체 {op}#이 {d}까지 번졌다는 방송이 나왔다.",{v:v.n||"",op,d:hn})},
    {t:ESC_FIN[E.m&&E.m.v]||"창문이 흔들렸다. 지금 나가지 않으면 늦는다."}];
}
function escScene(){
  const E=S.esc; if(!E||E.done)return;
  const kids=E.k==="kids", sub=escSubTo(), riv=escRiverTo(), dn=id=>DM[id].n;
  const keep=kids?null:{h:"집에 있는 것",L:[`현금 ${fmt(S.cash)} Mk`,
    has("safe")?"개인 금고가 있다":has("lock")?"보안 도어락이 있다":"금고도 도어락도 없다"]};
  scnOpen(escIntro(E).concat([
    {pic:"f_cry",t:kids?"누룩이 현관 앞에서 떨고 있었다.":"누룩이 이불에서 튀어나와 품으로 뛰어들었다.",card:keep},
    {pic:"f_cry",t:"어떻게 할까.",ch:[
      {t:"지하철역으로 뛴다",d:`제일 빠르다. 사람이 몰린다 · ${dn(sub)}까지`,f:()=>escGo("sub",sub)},
      {t:"걸어서 강을 건넌다",d:`느리지만 길이 넓다 · ${dn(riv)}까지`,f:()=>escGo("river",riv)},
      kids?{t:"문을 잠그고 숨는다",d:"대피 명령이 내려졌다",f:()=>escGo("home",sub)}
          :{t:"집에서 버틴다",d:"현금이랑 짐은 지킬 수 있다. 무너지면 다친다",f:()=>escGo("home",S.home)}]}]),
    {tag:`D+${S.day} · 새벽`,cls:"vn-red",end:escEnd});
}
/* 고른 길 — 결과는 시드·날짜·고른 길로 정해진다. 효과는 고르는 순간 반영 */
function escGo(how,dest){
  const E=S.esc; if(!E||E.done)return [];
  E.done=true; E.how=how;
  const kids=E.k==="kids", hn=DM[E.dist].n, dn=id=>DM[id].n;
  const r=mulberry32(hashStr(S.seed+"|esc|"+S.day+"|"+how))();
  dayRNG("esc"+how);
  let L, hurtK=null, rel=null;
  if(how==="sub"){
    if(r<0.7)L=[{t:"역은 이미 사람으로 꽉 차 있었다. 밀리고 밀려서 첫차에 올라탔다."},
      {t:dest==="hq"?"지하철은 협회 본부역에서 멈췄다. 역 앞이 대피소였다.":`지하철은 ${dn(dest)}에서 멈췄다. 역 앞에 대피소가 차려져 있었다.`}];
    else{hurtK="light"; L=[{t:"계단에서 사람들에 떠밀려 넘어졌다. 발목이 돌아갔다."},
      {pic:"f_cry",t:"구급대가 간이 병상으로 옮겨 줬다. 누룩은 품에서 떨어지지 않았다."}]}
  }else if(how==="river"){
    rel=r>=0.5&&r<0.8?nrRelic():null;
    if(r<0.8)L=(rel?[{t:"다리 밑 둔치를 지나는데 누룩이 품에서 빠져나갔다."},
        {pic:"f_hype",t:`잠시 뒤 뭔가를 물고 돌아왔다. 「${rel.n}」${josa(rel.n,["이었다","였다"])}.`}]
        :[{t:"다리 위로 사람들이 줄지어 걸었다. 아무도 말이 없었다."}])
      .concat([{t:`강을 건너 ${dn(dest)}까지 왔다. 여기는 아직 조용했다.`}]);
    else{hurtK="light"; L=[{t:"어두운 둔치 길에서 잔해에 발이 걸려 넘어졌다."},
      {pic:"f_cry",t:"지나가던 구급차가 실어 갔다. 누룩은 품에서 떨어지지 않았다."}]}
  }else if(kids){
    L=[{t:"문을 잠그고 불을 껐다. 누룩을 안고 숨을 죽였다."},
       {t:"한 시간쯤 지나 누가 문을 세게 두드렸다."},
       {w:"협회 요원",t:"대피 명령입니다. 지금 나오셔야 합니다."},

  memoPush(`${hn}에 ${what} 새벽 — ${went}`+(hurtK?` · ${days>=14?"중상":"경상"}`:""),"대피",true);
  if(S.over){scnClose(); return []}

    :has("safe")?"현금은 금고 안에 있어서 무사했다":"현금 피해는 없었다");
  if(hurtK)box.L.push(`${days>=14?"중상":"경상"} — ${days}일 입원 · 치료비 ${fmt(fee)} Mk`);

  render();
  /* 게임 화면이 한 프레임이라도 먼저 보이면 안 된다 — 언제 열어도 타이틀부터다.
     예전엔 한 번 본 사람은 타이틀을 건너뛰고 새 판 주식창으로 바로 떨어졌다 */
  opTitle();
  window.addEventListener("keydown",e=>{
    if(e.key==="Escape")closeModal();
    if(e.key==="Enter"&&!(e.target&&/^(TEXTAREA|INPUT|SELECT)$/.test(e.target.tagName))&&S&&S.t>=NIGHT&&!S.over&&!$("night").classList.contains("on")
       &&!$("gap").classList.contains("on")&&!scn.on)endDay();});
  window.addEventListener("keydown",e=>{
    if(!op.on||op.sc||e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.target&&/^(TEXTAREA|INPUT|SELECT)$/.test(e.target.tagName))return;
    if(e.key==="e"||e.key==="E"||e.key==="ㄷ")pvOpen();});
  let lp=0;
  document.addEventListener("pointerdown",e=>{if(!op.on||op.sc)return;
    const h=e.target&&e.target.closest&&e.target.closest(".op-card h1"); if(!h)return;
    clearTimeout(lp); lp=setTimeout(()=>{lp=0; pvOpen()},700)});
  ["pointerup","pointercancel"].forEach(t=>document.addEventListener(t,()=>{clearTimeout(lp); lp=0}));
})();
</script>
